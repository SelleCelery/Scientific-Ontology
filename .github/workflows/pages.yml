name: Public Navigator Pages

on:
  workflow_run:
    workflows:
      - Public Format Check
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify public site
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested main commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout selected ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-public-check.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify TypeScript build
        run: |
          npx --yes --package=typescript@5.8.3 -- \
            tsc -p navigator/tsconfig.json
          git diff --exit-code -- navigator/dist

      - name: Validate publication provenance boundary
        run: |
          python scripts/validate_docs_manifest.py \
            --release-gate \
            --historical-md-log _build/reports/pages_historical_attestation_report.md \
            --historical-json-log _build/reports/pages_historical_attestation_report.json \
            --github-annotations

      - name: Add historical attestation report to summary
        if: always()
        run: |
          if [ -f _build/reports/pages_historical_attestation_report.md ]; then
            cat _build/reports/pages_historical_attestation_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run DN-6 release gate
        run: |
          python scripts/check_dn6_release_gate.py --mode publication

      - name: Build public Pages artifact
        run: |
          python scripts/build_public_site.py

      - name: Check public Pages artifact
        run: |
          python scripts/check_public_site.py

      - name: Check deterministic public build
        run: |
          python scripts/build_public_site.py --check

      - name: Upload Pages validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-validation-report
          if-no-files-found: warn
          path: |
            _build/reports/pages_historical_attestation_report.md
            _build/reports/pages_historical_attestation_report.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/pages

  deploy:
    name: Deploy Public Navigator
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
