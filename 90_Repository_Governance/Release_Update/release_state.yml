release:
  version: "5.1.0"
  display_version: "v5.1.0"
  series: "v5"
  role: "self_audit_and_boundary_operation_convergence"
  status: "published"
  publication_date: "2026-09-18"
  planned_publication_date: "2026-09-18"
  title: "Scientific Ontology (SO) / 存在境界論: Public Edition v5.1.0"
  completion_claim: "self_audit_foothold_not_method_completion"

  theme:
    ja: "境界に触れたあと、何を持ち帰り、何を直し、何を未解決として残すか。"
    ja_authority: "human"
    en: "After contact at a boundary, what do we bring back, revise, and leave unresolved?"
    en_status: "commensurated_release_theme"

  purpose:
    ja: |-
      v5.0.0は、存在境界論を言語、文学、制度、AI、インターフェイス等へ持ち出し、外部との接触から返る残差を受けるv5系を開いた。
      v5.1.0では、その接触を理論自身へ返す方法を主題化する。AIを対象とした構造健全性・個性形成研究から再接続された有限探索、切断、返路、異なる探索frontierの問題を「正しさ」の工学的定義へ置き、SO再帰的哲学研究、07の異質対象への曝露、物理・宇宙論Research Notes、Assessment / commensuration、Navigatorと文書contractを通じて、何に接触し、何を根拠に判断し、どこでscopeを分け、何を訂正し、何を未解決として残すかを追跡する足場を整える。
      これは自己監査方法、reciprocal assessment、revision schemaの完成を宣言するものではない。越境・被越境に伴う基準・権限・返路の問題は学問間だけに限られないという射程を示唆するが、v5.1.0では一般社会理論として確定しない。
      最終監査では、「正しさ」の判定機構が軸そのものを裁くのではなく、軸の内容に依存せず、その軸のもとで形成された有限系の支持・探索・外部接触・再開可能性を判定している可能性がworking hypothesisとして露出した。v5.1.0では結論化せず、後続の検証課題として返す。
    authority: "human"

  highlights:
    # Human-approved direction; wording remains subject to final release review.
    - id: "correctness_model"
      en: "Publish Correctness, Individuality, Absence, and Cut as the public definition owner for SO’s engineering treatment of finite inquiry, defeaters, cuts, individuality, return, and reopening."
      ja: "有限探索、defeater、切断、個性、返路、再開を扱うSOの工学的な「正しさ」の公開定義ownerとして『正しさ・個性・無・切断』を導入する。"
      status: "included"

    - id: "reflexive_research"
      en: "Add SO Reflexive Philosophical Research and Volume I as a public self-audit interface that preserves experimental history, judgment transparency, provenance, and historical attestation without rewriting prior records to current conclusions."
      ja: "SO再帰的哲学研究とVolume Iを、実験史、判断透明性、provenance、historical attestationを保持し、過去記録を現在の結論へ書き換えない公開自己監査インターフェースとして導入する。"
      status: "included"

    - id: "external_exposure_07"
      en: "Introduce 07_Creative_Offshoots as an external-exposure surface where SO can meet heterogeneous questions, vocabularies, values, criticism, and expression without assuming a shared SO grammar."
      ja: "SOの共有文法を前提にしない問い・語彙・価値・批判・表現へ接触する外部曝露面として07_Creative_Offshootsを導入する。"
      status: "included"

    - id: "assessment_commensuration_contract"
      en: "Add a candidate Assessment / Commensuration contract that separates external non-establishment, non-derivability, fact conflict, SO-internal non-derivability and defeaters, external-reference misstatement, alternate interpretation, and reciprocal bridge dispute before response selection."
      ja: "外部未確立、外部非導出、外部既知事実衝突、SO内部非導出・defeater、外部参照誤記、同一事実・異位相解釈、相互bridge係争を応答前に分離するCandidate Assessment / Commensuration contractを追加する。"
      status: "included"

    - id: "fact_ground_and_revision_trace"
      en: "Separate fact candidates, support paths, and ground hypotheses, and use physics-adjacent Research Notes as a non-normative surface for observing what a revision trace must preserve when correction, scope restriction, or suspension becomes necessary."
      ja: "事実候補・支持経路・根拠仮説を分離し、訂正・scope制限・保留が必要になった場合にrevision traceが何を保持すべきかを、物理近接Research Notesの非規範的な例から観察する。"
      status: "included"

    - id: "navigator_document_contract"
      en: "Strengthen the manifest-backed document contract and Public / Developer Navigator boundary, expanding the managed public corpus from 128 to 157 documents with 49 Japanese-English pair families and explicit role, language, assessment, and relation ownership."
      ja: "manifest-backed document contractとPublic / Developer Navigator境界を強化し、公開管理対象を128文書から157文書へ拡張する。49の日英pair familiesを含め、役割・言語関係・評価・relationの所有点を明示する。"
      status: "included"

  zenodo_description_en: >-
    Scientific Ontology (SO) / 存在境界論 Public Edition v5.1.0 turns the v5 living series back toward the operation of boundaries themselves. Building on v5.0.0’s outward expansion, it adds a public correctness model grounded in finite inquiry, defeaters, cuts, individuality, return, and reopening; a reflexive research program preserving judgment and audit history; an external-exposure layer for heterogeneous contact; a candidate Assessment / Commensuration contract; physics-adjacent revision-trace examples; and a more explicit manifest/Navigator document contract. The release treats correction, scope restriction, unresolved residuals, and return paths as inspectable parts of boundary operation rather than post-publication cleanup.

  zenodo_notes_en: >-
    v5.1.0 is a convergence release within the v5 living series. It establishes a foothold for self-audit and boundary operation, not a completed self-audit methodology, reciprocal assessment model, revision schema, or full scientific audit. The detailed Human–AI formation history remains outside the SO public repository for now. The release also does not treat implementation success, external non-establishment, or difference of interpretive phase as automatic proof or refutation. Final audit surfaced a working hypothesis that the correctness criterion may be invariant to the content of the governing axis; v5.1.0 records this only as a later verification question, not as an established result.

  release_context_en: >-
    v5.1.0 is a convergence release within the v5 living series. It establishes a foothold for self-audit and boundary operation, not a completed self-audit methodology, reciprocal assessment model, revision schema, or full scientific audit. The detailed Human–AI formation history remains outside the SO public repository for now. Final audit also surfaced a working hypothesis: the correctness criterion may operate independently of the content of the governing axis, evaluating the finite system formed under that axis rather than certifying the axis itself. This remains a post-v5.1 verification question.

  open_questions:
    - id: "axis_invariant_correctness_criterion"
      status: "working_hypothesis"
      disposition: "post_v5_1_verification"
      ja: "正しさの判定機構は軸そのものを裁くのではなく、軸の内容に依存せず、その軸のもとで形成された有限系の支持・探索・外部接触・再開可能性を判定している可能性がある。"
      en: "The correctness criterion may operate independently of the content of the governing axis, evaluating support, inquiry, external contact, and reopenability of the finite system formed under that axis rather than certifying the axis itself."
      boundary: "v5.1.0では結論化せず、後続検証課題として保持する。"

  public_boundary:
    en: >-
      The Candidate Assessment Contract remains candidate governance rather than a final cross-domain adjudication system. Revision-trace examples in physics-adjacent Research Notes are non-normative, and v5.1.0 does not include a full physics/cosmology scientific audit, a formal reciprocal S/E model, or a completed bridge-overreach subtype schema. The detailed Human–AI formation history remains local/private rather than being imported into the SO public repository. DSSI/ConnectBits product code is not bundled into SO. Files explicitly held as local/internal and non-public core materials remain outside the Public Edition.
    ja: >-
      Assessment Contractは最終的な領域横断裁定系ではなくCandidate governanceとして保持する。物理近接Research Notesのrevision trace例は非規範であり、v5.1.0には物理・宇宙論の全面科学監査、formal reciprocal S/E model、bridge-overreach subtype schemaの完成を含めない。詳細なHuman–AI形成史はSO公開Repositoryへ取り込まずlocal/private側に保持する。DSSI / ConnectBitsの製品コードもSOへ同梱しない。明示的にlocal/internal保留された資料と非公開CoreはPublic Editionの公開対象外とする。

series_anchor:
  ja: "事象は境界で起きている。主観でも客観でもなく、それらが混ざり合うところで。"
  ja_authority: "human"
  en: "Events happen at boundaries. Neither simply subjective nor simply objective, but where different modes of description come into contact."
  en_status: "fixed_public_interface"

series_policy:
  model: "living_series"
  default_branch_for_new_work: "v5.x"
  continue_v5_until: >-
    v5系の前提、基礎的な記述面、概念所有、または中核不変項そのものを再編する必要がある
    構造的要素が見つかるまで、研究・実装・外部照合の成果をv5.xとして追加する。
  v6_transition_condition: >-
    単なる研究追加や実装追加ではなく、v5系の枠そのものでは吸収できず、
    体系全体の説明本拠地または中核構造を一段組み替える必要が生じた場合にv6系への移行を検討する。
  authority: "human"

