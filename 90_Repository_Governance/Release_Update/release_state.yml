  orcid_url: "https://orcid.org/0009-0001-5709-2669"

release:
  version: "5.0.0"
  display_version: "v5.0.0"
  status: "preparation" # preparation | release_candidate | published | superseded
  publication_date: null # YYYY-MM-DD; set only when fixed
  title: "Scientific Ontology (SO) / 存在境界論: Public Edition v5.0.0"

  theme:
    ja: "事象は境界で起きている。主観でも客観でもなく、それらが混ざり合うところで。"
    ja_authority: "human"
    en: null
    en_status: "pending_commensuration"

  purpose:
    ja: >-
      v4系までに積み上げた境界・履歴・通信・返路の理論を体系内部から遊離させ、
      言語、文学、会計、制度、AI、インターフェイスへ実装・汎用化し、
      外部との接触から返る残差によって理論自身を再照合するv5系を開始する。
    authority: "human"

  highlights:
    # Human-approved factual release highlights only.
    # Keep these short; RELEASE_NOTES.md may expand them, but must not invent new claims.
    - id: "language_meaning_communication_phase"
      ja: "言語・意味・通信位相研究の公開正本群を導入する。"
      status: "included"
    - id: "dssi_research_note"
      ja: "DSSIの観測・判断・主権・責任返還に関する研究ノートを公開研究線へ導入する。"
      status: "included"
    - id: "consent_boundary"
      ja: "同意境界とセンテンス／ビット非対称の研究ノートを公開研究線へ導入する。"
      status: "included"
    - id: "literature_worldmaking"
      ja: "世界制作としての文学を公開研究ノートとして導入する。"
      status: "included"

previous_release:
  version: "4.3.0"
  display_version: "v4.3.0"
