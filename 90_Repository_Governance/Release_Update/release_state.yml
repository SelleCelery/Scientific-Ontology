  publication_date: "2026-07-16"

zenodo:
  version_family_doi: "10.5281/zenodo.19222394"
  version_doi:
    status: "pending" # pending | assigned
    value: null
    url: null
  related_identifiers:
    previous_release_relation: "isNewVersionOf"
    repository_relation: "isSupplementedBy"

citation:
  type_cff: "dataset"
  preferred_citation_type: "report"
  publication_type_zenodo: "report"
  year: 2026
  publisher: "Zenodo"
  author_name_policy: "preserve_unicode_public_name"
  orcid_policy: "propagate_exactly"

release_artifacts:
  # Core update pack. README/Roadmap are human-owned documents;
  # the others are synchronized or drafted from this state.
  core:
    - path: "README.md"
      ownership: "human"
    - path: "Roadmap.md"
      ownership: "human"
    - path: "RELEASE_NOTES.md"
      ownership: "ai_draft_human_approve"
    - path: "CITATION.cff"
      ownership: "machine_sync"
    - path: "CITATION.md"
      ownership: "machine_sync_human_review"
    - path: ".zenodo.json"
      ownership: "machine_sync"

validation:
  require_exact_version_match: true
  require_exact_author_name_match: true
  require_exact_orcid_match: true
  require_release_date_match_when_set: true
  forbid_inferred_romanization: true
  forbid_placeholder_doi: true
  require_previous_release_link: true
  require_clean_json_for_zenodo: true
  require_valid_yaml_for_cff_and_state: true
