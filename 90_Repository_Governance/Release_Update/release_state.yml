release:
  version: "5.1.1"
  display_version: "v5.1.1"
  series: "v5"
  role: "metaphysical_research_and_audit_convergence"
  status: "published"
  publication_date: "2026-10-26"
  planned_publication_date: null
  title: "Scientific Ontology (SO) / 存在境界論: Public Edition v5.1.1"
  completion_claim: "publication_complete_not_repository_audit_completion"

  theme:
    ja: "境界に触れたあと、何を持ち帰り、何を直し、何を未解決として残すか。"
    ja_authority: "human"
    en: "After contact at a boundary, what do we bring back, revise, and leave unresolved?"
    en_status: "commensurated_release_theme"

  subtheme:
    ja: "正しさを、形而上からの演繹と形而下からの工学で挟み込む。"
    ja_authority: "human"
    en: "Approach correctness from both sides: deduction from metaphysics and engineering under concrete finite conditions."
    en_status: "commensurated_release_subtheme"

  purpose:
    ja: |-
      v5.1.0は、境界接触のあとに何を持ち帰り、何を訂正し、何を未解決として残すかを公開構造へ置き、自己監査と境界運用の足場を成立させた。
      v5.1.1では、この主題を据え置き、サブテーマとして「正しさを、形而上からの演繹と形而下からの工学で挟み込む」を置く。形成源を再検討したのは、形成源そのものを現在正本へ戻すためではなく、完全性と不完全性、無・切断、論理形成、自己参照が「正しさ」に何を要請するかを形而上側から演繹し、有限資源下の探索・審理・監査・実装という形而下側の工学による結果と照合するためである。著者の研究姿勢と能動的Returnを公開メタ記述として分離し、「正しさ」では命題レベルの審理と文書・体系レベルの監査を分け、位相付き審理と再審理条件を明示する。05ではAMP・ITS・Gödel系を現在正本の証拠へ逆投影せず形成上の補給線として扱うMetaphysical Approachを整え、生成形而上学・歴史計算・物理近接研究とEngineering Research on Correctnessを一つの研究面へ再配置する。対応する英語通約も追加・再照合する。
      同時に、既存checkerの観測をpublic format、repository structure、semantic review、operational integrityへ分離し、明示的に監査対象とした面だけをAuditFinding候補へ写像する決定論的machine-audit laneを導入する。FindingはVerdictではなく、機械監査は正本文書・概念owner・理論命題を自動変更しない。このlaneはRepository全体のα／β監査そのものではなく、その実行に先行する下層の機械実装であり、Repository全体へのα／β監査はv5.1.1公開時点では未実施である。
      v5.1.1は2026-10-26公開のPublic Editionであり、版固有DOIは10.5281/zenodo.23658812である。release時検証ではmanifest / read-model同期を通し、183 public catalog documents / 62 Japanese-English pair familiesを確認した。v5.1.0の公開確定値157 / 49は、その時点のrelease値として保持し、遡及的には書き換えない。
    authority: "human"

  highlights:
    - id: "authorial_stance_active_return"
      en: "Add Authorial Research Stance and Public Declaration as a public meta statement separating truth-oriented authorship, publication, social action, active Return, and formation history from concept-definition authority."
      ja: "『著者の研究姿勢と公開宣言』を公開メタ記述として追加し、真実志向の記述、公開、社会への作用、能動的Return、形成史を概念定義の権限から分離する。"
      status: "included"

    - id: "adjudication_audit_phase"
      en: "Refine the public correctness owner by separating proposition-level adjudication from document/system-level audit, introducing topology-aware adjudication and an explicit falsification condition for lossless collapse of topological structure."
      ja: "公開『正しさ』ownerで、命題レベルの審理と文書・体系レベルの監査を分離し、位相付き審理と、位相構造を無損失に単一化できる場合の明示的な反証条件を追加する。"
      status: "included"

    - id: "metaphysical_approach_reorganization"
      en: "Establish Metaphysical Approach as a research-note boundary that keeps AMP/ITS/Gödel materials as formation supply lines rather than proof, while collating generative metaphysics, historical computation, physics-adjacent hypotheses, and Engineering Research on Correctness."
      ja: "AMP・ITS・Gödel系を論証根拠ではなく形成上の補給線として保持し、生成形而上学、歴史計算、物理近接仮説、Engineering Research on Correctnessを照合する研究面としてMetaphysical Approachを整備する。"
      status: "included"

    - id: "english_commensuration_expansion"
      en: "Add and re-collate English commensurations across the Metaphysical Approach research line and the expanded correctness text, preserving the topology/stage/physical-phase distinction and the SO Absence / AMP Nihil boundary without promoting English to authority over the Japanese originals."
      ja: "Metaphysical Approach研究線と拡張された『正しさ』について英語通約を追加・再照合する。SOの関係的な『位相』はtopology系、段階・局面はstage、物理相はphaseとして分け、SO運用上の『無』はAbsence、AMP固有の形而上学的『無』はNihilとして境界を保持する。日本語正本に対する英語側の権限昇格は行わない。"
      status: "included"

    - id: "applied_metaphysics_v6_preview"
      en: "Publish the existing Overview of the Applied Metaphysics System as a non-canonical v6 transition preview, paired with its English commensuration, while leaving the candidate authoritative text and its final terminology outside v5.1.1 canonical authority."
      ja: "既存の『応用形而上学体系 概説』を、英語通約と対にしたnon-canonicalなv6 transition previewとして公開面に置く。正本候補そのものと最終用語体系はv5.1.1の正本権限へ昇格させない。"
      status: "included"

    - id: "machine_audit_lane"
      en: "Add an experimental deterministic repository machine-audit lane that classifies checker observations by source surface, maps only declared audit-eligible issues, preserves excluded and unmapped issues, and fixes Finding != Verdict as a no-canonical-writeback boundary. This is a lower-layer implementation preceding broader Repository-wide alpha/beta audit execution; Repository-wide alpha/beta audit has not yet been executed."
      ja: "checker観測をsource surface別に分類し、明示された監査対象だけを写像し、除外・未写像issueも保持する決定論的Repository machine-audit laneを実験導入する。Finding != Verdictを固定し、canonical writebackは行わない。これはRepository全体のα／β監査に先行する下層実装であり、Repository全体へのα／β監査はまだ実施していない。"
      status: "included"

    - id: "candidate_read_model_sync"
      en: "Restore release read-model regeneration by registering the navigation topics already used by the authorial-statement metadata and validate the v5.1.1 corpus at 183 public documents with 62 Japanese-English pair families."
      ja: "著者研究姿勢文書のmetadataで既に使用していたnavigation topicを検索設定へ登録し、release read model再生成を復旧する。v5.1.1はpublic 183文書・日英62 pair familiesとして検証する。"
      status: "included"

    - id: "research_path_cleanup"
      en: "Remove superseded correctness-study paths and redirect overview/system-map entrances to the consolidated Metaphysical Approach research surface."
      ja: "旧Correctness研究pathを整理し、Overview / System Mapの入口を統合後のMetaphysical Approach研究面へ付け替える。"
      status: "included"

  zenodo_description_en: >-
    Scientific Ontology (SO) / 存在境界論 Public Edition v5.1.1 retains the v5.1.0 question of what to bring back, revise, and leave unresolved after boundary contact. Its v5.1.1 subtheme is to approach correctness from both sides: deduction from metaphysics and engineering under concrete finite conditions. It separates authorial stance from concept ownership; distinguishes proposition-level adjudication from document/system-level audit; re-examines AMP/ITS/Gödel-derived formation material as formation provenance rather than higher authority; reorganizes generative metaphysics, historical computation, physics-adjacent hypotheses, and Engineering Research on Correctness under a Metaphysical Approach research surface; expands English commensuration; and introduces an experimental deterministic repository machine-audit lane whose findings have no automatic canonical effect.

  zenodo_notes_en: >-
    Formation sources are not promoted into evidentiary or canonical authority, machine-audit findings are not verdicts, and successful tooling does not establish the truth of Scientific Ontology. The deterministic machine-audit lane is a lower-layer precursor to broader Repository-wide alpha/beta audit execution; no Repository-wide alpha/beta audit has yet been executed. The v5.1.1 document-index/public-catalog pipeline validates at 183 public documents and 62 Japanese-English pair families. Full physics/cosmology scientific audit, private-core publication, and DSSI/ConnectBits product-code bundling remain outside this release.

  release_context_en: >-
    v5.1.1 was initially framed as a short-cycle maintenance line after v5.1.0. Returns gathered after publication widened the work without replacing the v5.1.0 release theme. Formation sources were re-examined not to restore them as canon, but to deduce from the metaphysical side what completeness, incompleteness, Absence, Cut, logical formation, and self-reference require of correctness, and to compare those deductions with results obtained through concrete engineering under finite-resource conditions, including inquiry, adjudication, audit, commensuration, and implementation. v5.1.1 records this two-sided examination of correctness while keeping authority levels separate; it remains inside the v5 living series and does not by itself trigger a v6 canonical re-foundation.

  open_questions:
    - id: "axis_invariant_correctness_criterion"
      status: "working_hypothesis"
      disposition: "post_v5_1_verification"
      ja: "正しさの判定機構は軸そのものを裁くのではなく、軸の内容に依存せず、その軸のもとで形成された有限系の支持・探索・外部接触・再開可能性を判定している可能性がある。"
      en: "The correctness criterion may operate independently of the content of the governing axis, evaluating support, inquiry, external contact, and reopenability of the finite system formed under that axis rather than certifying the axis itself."
      boundary: "v5.1.1でも結論化せず、後続検証課題として保持する。"


  public_boundary:
    en: >-
      v5.1.1 was published on 2026-10-26 as a Public Edition release. Its version-specific Zenodo DOI is 10.5281/zenodo.23658812. Metaphysical Approach remains a Research Notes surface and does not establish a v6 applied-metaphysics canon. The Applied Metaphysics System overview is published only as a non-canonical v6 transition preview. AMP/ITS/Gödel materials are treated as formation provenance and hypothesis supply lines, not as evidence that overrides current public owners. Repository machine audit remains experimental developer tooling with no canonical writeback: Finding is not Verdict, unsupported detectors remain unsupported, and a validating audit run does not prove the theory. It is a lower-layer implementation preceding broader Repository-wide alpha/beta audit execution, and no Repository-wide alpha/beta audit had been completed as of the v5.1.1 publication cut. Full physics/cosmology scientific audit remains deferred. Detailed Human-AI formation history remains local/private, DSSI/ConnectBits product code is not bundled into SO, and explicitly held internal/private-core material remains outside the Public Edition.
    ja: >-
      v5.1.1は2026-10-26公開のPublic Editionであり、版固有Zenodo DOIは10.5281/zenodo.23658812である。Metaphysical ApproachはResearch Notesの研究面であり、v6応用形而上学正本の確立を意味しない。『応用形而上学体系 概説』はnon-canonicalなv6 transition previewとしてのみ公開面へ置く。AMP・ITS・Gödel系資料は形成provenanceと仮説の補給線として扱い、現在の公開ownerを上書きする証拠権限を持たない。Repository machine auditはcanonical writebackを持たない実験的Developer toolingであり、FindingはVerdictではなく、unsupported detectorは未対応のまま保持し、audit runのvalidation成功を理論の証明へ昇格させない。これはRepository全体のα／β監査に先行する下層実装であり、v5.1.1公開時点ではRepository全体へのα／β監査は完了していない。物理・宇宙論の全面科学監査は引き続き後続課題とする。詳細なHuman–AI形成史はlocal/privateに保持し、DSSI / ConnectBits製品コードはSOへ同梱せず、明示的なinternal/private coreもPublic Edition外に置く。

series_anchor:
  ja: "事象は境界で起きている。主観でも客観でもなく、それらが混ざり合うところで。"
