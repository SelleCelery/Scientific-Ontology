line":567,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:14.22","phase":"SAT","literal":"なら","text":"著者の表現で言えば、**「完成するなら、そのとき私は地上の神となっているだろう。」**","line":571,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:14.22","phase":"SAT","literal":"とき","text":"著者の表現で言えば、**「完成するなら、そのとき私は地上の神となっているだろう。」**","line":571,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"RAJ:L18:S1","phase":"RAJ","literal":"とき","text":"履歴を持つ観測者に差分が接触したとき、何が感じられ、何が理解可能になり、何が見えなくなるという方向性は、どのように形成されるのか。","line":18,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L220:S1","phase":"RAJ","literal":"とき","text":"したがって、認識軸を照合するときには、何を見ているかだけでなく、何を見ないことでその世界像が成立しているかを問う必要がある。","line":220,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["だけでなく"]},{"unit":"RAJ:L401:S1","phase":"RAJ","literal":"なら","text":"これらを確認し、必要なら関心、捨象、価値、コストの配分を組み替えることである。","line":401,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L583:S2","phase":"RAJ","literal":"場合は","text":"意味に不一致がある場合は、日本語正本と定義所有文書へ戻って照合する。","line":583,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["場合"]},{"unit":"TAM:L26:S1","phase":"TAM","literal":"とき","text":"異なる認識形式が接触したとき、それぞれの中核を壊さず、何を翻訳し、何を保留し、何を接続し、何を残差として保持すべきか。","line":26,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L78:S1","phase":"TAM","literal":"とき","text":"ここでいう選択公理とは、世界を読むときに、何を第一に置き、何を証拠とし、何を実在的に扱い、何を背景へ送り、どの価値を守るかを決める認識上の選択点である。","line":78,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L287:S1","phase":"TAM","literal":"場合","text":"接続しやすい体系は、中核を曖昧にしている場合もある。","line":287,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["場合"]},{"unit":"TAM:L288:S1","phase":"TAM","literal":"場合","text":"接続しにくい体系は、重要な差分を強く保持している場合もある。","line":288,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["場合"]},{"unit":"TAM:L313:S1","phase":"TAM","literal":"とき","text":"運用条件が変わったとき、どこまで変形しても中核を保持できるかを見るための履歴層である。","line":313,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L341:S1","phase":"TAM","literal":"場合","text":"その場合、同じ名称を一つの箱へ押し込めるのではなく、どの問いに対するモジュールとして用いているかを明示する。","line":341,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["場合"]},{"unit":"TAM:L397:S1","phase":"TAM","literal":"とき","text":"異なるモジュールを接続するときは、次の順序を用いる。","line":397,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["次の"]},{"unit":"TAM:L429:S1","phase":"TAM","literal":"場合","text":"照合手続きが異なる場合、結論だけを直接比較しない。","line":429,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["場合","だけ"]},{"unit":"TAM:L495:S1","phase":"TAM","literal":"場合","text":"この場合、理解可能性を保持しながら、運用ポートは閉じることがある。","line":495,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["場合"]},{"unit":"TAM:L656:S1","phase":"TAM","literal":"場合","text":"量子力学、相対性理論、熱力学などを選択公理モジュールへ置く場合、それらを単なる世界観へ縮退させない。","line":656,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["場合","単なる"]},{"unit":"TAM:L695:S1","phase":"TAM","literal":"とき","text":"真理の経営学へ渡すときには、目的名だけでなく、次を添える。","line":695,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["だけでなく"]},{"unit":"TAM:L803:S1","phase":"TAM","literal":"とき","text":"それは、認識軸が世界観、方法、倫理、制度、技術設計として明示されたとき、異なる体系の間に通信ポートを作るための境界プロトコルである。","line":803,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L836:S2","phase":"TAM","literal":"場合は","text":"意味に不一致がある場合は、日本語正本と定義所有文書へ戻って照合する。","line":836,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["場合"]}],"CONNECT":[{"unit":"RAJ:L146:S1","phase":"RAJ","literal":"接続し","text":"同じ言葉でも、ある履歴には接続し、別の履歴には接続しない。","line":146,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L146:S1","phase":"RAJ","literal":"接続し","text":"同じ言葉でも、ある履歴には接続し、別の履歴には接続しない。","line":146,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L460:S1","phase":"RAJ","literal":"通約する","text":"`Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md` は、この明示化された認識パターンを、異なる分野や世界観の間で比較・通約する。","line":460,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L471:S1","phase":"RAJ","literal":"接続する","text":"どの条件で軸が硬直、漂移、分岐、再接続するか","line":471,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L506:S1","phase":"RAJ","literal":"接続する","text":"ただし、存在境界論の高強度仮説へ接続すると、認識軸は時間と履歴の構造としても読める。","line":506,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["ただし"]},{"unit":"RAJ:L512:S1","phase":"RAJ","literal":"接続する","text":"内在時間：差分を受け取り、保留し、切断し、返し、後続条件へ接続する意味ループのコミットによって進む、局所的存在に固有の時間。","line":512,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L523:S1","phase":"RAJ","literal":"接続し","text":"この節の役割は、平面論理上で安定した認識軸が、どの深度履歴へ接続しているかを示すポートを残すことにある。","line":523,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"TAM:L26:S1","phase":"TAM","literal":"翻訳し","text":"異なる認識形式が接触したとき、それぞれの中核を壊さず、何を翻訳し、何を保留し、何を接続し、何を残差として保持すべきか。","line":26,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L26:S1","phase":"TAM","literal":"接続し","text":"異なる認識形式が接触したとき、それぞれの中核を壊さず、何を翻訳し、何を保留し、何を接続し、何を残差として保持すべきか。","line":26,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L110:S1","phase":"TAM","literal":"接続する","text":"したがって、語彙の一致だけで接続すると、偽の通約が起こる。","line":110,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["だけ"]},{"unit":"TAM:L119:S1","phase":"TAM","literal":"接続する","text":"遮断：接続すると中核または責任境界が破壊される。","line":119,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L141:S1","phase":"TAM","literal":"接続する","text":"どの条件で硬直、漂移、分岐、再接続するか","line":141,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L287:S1","phase":"TAM","literal":"接続し","text":"接続しやすい体系は、中核を曖昧にしている場合もある。","line":287,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["場合"]},{"unit":"TAM:L288:S1","phase":"TAM","literal":"接続し","text":"接続しにくい体系は、重要な差分を強く保持している場合もある。","line":288,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["場合"]},{"unit":"TAM:L339:S1","phase":"TAM","literal":"接続する","text":"たとえば、カントはL0の物自体、L1の現象と物自体、L2の認識形式、L3の義務論へ接続する。","line":339,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L397:S1","phase":"TAM","literal":"接続する","text":"異なるモジュールを接続するときは、次の順序を用いる。","line":397,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["次の"]}],"CONTACT":[{"unit":"SAT:0.3","phase":"SAT","literal":"接触し","text":"認識とは、境界において、内部ヒューリスティックと外部ヒューリスティックが接触し、同期し、照合され、残差を残しながら更新される過程である。","line":27,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:1.3","phase":"SAT","literal":"接触する","text":"存在は、履歴を持つ場として、外部と接触する。","line":47,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:1.4.2","phase":"SAT","literal":"接触し","text":"境界は、外部入力と内部履歴が接触し、通過・保留・遮断・再符号化・反射・更新される面である。","line":53,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:15.12.1","phase":"SAT","literal":"接触し","text":"知るとは、境界で接触し、同期し、照合し、残差を保持しながら、次の判断可能性を開くことである。","line":605,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["次の"]},{"unit":"RAJ:L18:S1","phase":"RAJ","literal":"接触した","text":"履歴を持つ観測者に差分が接触したとき、何が感じられ、何が理解可能になり、何が見えなくなるという方向性は、どのように形成されるのか。","line":18,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L34:S1","phase":"RAJ","literal":"接触し","text":"それは、異なるものが接触し、あるものが前景となり、別のものが背景となり、世界が一つの認識可能な形を得る生成運動である。","line":34,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L105:S1","phase":"RAJ","literal":"接触し","text":"認識軸とは、エントロピー属性を帯びた差分が観測者の境界に接触し、関心と捨象を通じて感性と悟性の編成を変化させ、価値とコストの重みづけ、残差、反復を経て、安定した観測方向として形成されるものである。","line":105,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L141:S1","phase":"RAJ","literal":"接触し","text":"本稿でいう差分とは、観測者の境界に接触し、何らかの反応、違和感、関心、切断、意味圧、残差を生じさせるものを指す。","line":141,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L163:S1","phase":"RAJ","literal":"接触する","text":"それは、入力と観測者の履歴が接触する境界で生じる関係的性質である。","line":163,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L182:S1","phase":"RAJ","literal":"接触し","text":"関心が境界へ向いていれば、誰のどの履歴に接触し、何を壊し、何を残したかが見える。","line":182,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L319:S1","phase":"RAJ","literal":"接触して","text":"言語化できなかった違和感は、後の出来事と接触して初めて意味を持つことがある。","line":319,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L333:S1","phase":"RAJ","literal":"接触する","text":"1. 差分が境界に接触する。","line":333,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L373:S1","phase":"RAJ","literal":"接触し","text":"新しい差分が反復して接触し、既存の価値とコストの配分では処理できなくなると、認識軸は徐々に漂移する。","line":373,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L392:S1","phase":"RAJ","literal":"接触する","text":"残差が保持され、別の履歴または外部入力と接触すると、既存の認識軸は再照合される。","line":392,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"TAM:L26:S1","phase":"TAM","literal":"接触した","text":"異なる認識形式が接触したとき、それぞれの中核を壊さず、何を翻訳し、何を保留し、何を接続し、何を残差として保持すべきか。","line":26,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]}],"CUT":[{"unit":"SAT:9.12.1","phase":"SAT","literal":"切断し","text":"嘘とは、照合経路を切断し、残差へのアクセスを塞ぐ操作である。","line":363,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:10.9","phase":"SAT","literal":"切断する","text":"真偽判定から残差へのアクセス経路を切断すると、命題は制度的には機能しても、意味論的には劣化する。","line":413,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"RAJ:L188:S1","phase":"RAJ","literal":"捨象する","text":"ある差分へ強く関心を向けることは、別の差分を捨象する条件にもなる。","line":188,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L196:S1","phase":"RAJ","literal":"切断する","text":"捨象とは、差分を保持しない、背景化する、切断する、保留する、または別の処理へ送る方向である。","line":196,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L204:S1","phase":"RAJ","literal":"捨象する","text":"認識は、何かを捨象することで初めて一定の形を得る。","line":204,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L287:S1","phase":"RAJ","literal":"捨象し","text":"正しさを価値として強く保持すれば、関係の痛みや返路の切断を捨象しやすくなる。","line":287,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L288:S1","phase":"RAJ","literal":"捨象し","text":"共感を価値として強く保持すれば、構造上の責任や制度的残差を捨象しやすくなる。","line":288,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L336:S1","phase":"RAJ","literal":"切断する","text":"4. 捨象が別の差分を背景化、保留、切断する。","line":336,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L398:S1","phase":"RAJ","literal":"捨象し","text":"何を捨象していたのか。","line":398,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L512:S1","phase":"RAJ","literal":"切断し","text":"内在時間：差分を受け取り、保留し、切断し、返し、後続条件へ接続する意味ループのコミットによって進む、局所的存在に固有の時間。","line":512,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"TAM:L112:S1","phase":"TAM","literal":"切断する","text":"語彙の不一致だけで切断すると、接続可能な構造まで失われる。","line":112,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["だけ"]},{"unit":"TAM:L189:S1","phase":"TAM","literal":"切断する","text":"捨象とは、その体系が扱わないもの、背景化するもの、切断するもの、別の処理へ送るものである。","line":189,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L193:S1","phase":"TAM","literal":"捨象し","text":"認識は、何かを捨象しなければ成立しない。","line":193,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L197:S1","phase":"TAM","literal":"捨象し","text":"物質だけを見る体系は、クオリアや意味を捨象しやすい。","line":197,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["だけ"]},{"unit":"TAM:L198:S1","phase":"TAM","literal":"捨象し","text":"内面だけを見る体系は、制度や外部責任を捨象しやすい。","line":198,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["だけ"]},{"unit":"TAM:L199:S1","phase":"TAM","literal":"捨象し","text":"秩序だけを見る体系は、例外や苦痛を捨象しやすい。","line":199,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["だけ"]},{"unit":"TAM:L200:S1","phase":"TAM","literal":"捨象し","text":"救済だけを見る体系は、現実の手続きや検証を捨象しやすい。","line":200,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["だけ"]},{"unit":"TAM:L414:S1","phase":"TAM","literal":"捨象し","text":"一方が見ているものを、他方が意図的に捨象しているのか。","line":414,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["一方"]},{"unit":"TAM:L664:S1","phase":"TAM","literal":"捨象し","text":"それらが、通常の科学や哲学が捨象しやすい名づけ、象徴、対応、儀礼、配置、身体感覚、共同体履歴をどのように前景化するかを照合する。","line":664,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L699:S1","phase":"TAM","literal":"捨象し","text":"その目的が捨象しやすい差分","line":699,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L805:S1","phase":"TAM","literal":"捨象し","text":"各モジュールは、何に関心を向け、何を捨象し、何を価値として保持し、何をコストとして処理するかを持つ。","line":805,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]}],"DEFINE":[{"unit":"SAT:0.2","phase":"SAT","literal":"とは","text":"知とは、履歴を持つ存在が、外部からの入力を受け取り、内部で処理し、外部と同期し、その一致・不一致・残差を照合し、なお閉じきれないものを保持しながら、次の判断可能性を維持することで成立する。","line":21,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:0.2.1","phase":"SAT","literal":"とは","text":"したがって、認識とは「世界をそのまま写すこと」ではない。","line":23,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:0.2.2","phase":"SAT","literal":"とは","text":"また、認識とは「主体が勝手に構成すること」でもない。","line":25,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:0.3","phase":"SAT","literal":"とは","text":"認識とは、境界において、内部ヒューリスティックと外部ヒューリスティックが接触し、同期し、照合され、残差を残しながら更新される過程である。","line":27,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:1.2.1","phase":"SAT","literal":"とは","text":"履歴とは、単なる過去ではなく、次の受け取り方・反応・判断・意味づけを変えるものである。","line":45,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる","次の"]},{"unit":"SAT:2.1","phase":"SAT","literal":"とは","text":"感性とは、外部入力が履歴場に到達したとき、何が信号として立ち上がるかを決める受容構造である。","line":71,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:3.1","phase":"SAT","literal":"とは","text":"悟性とは、入力を判断可能な対象へ変換する分類構造である。","line":103,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:3.2","phase":"SAT","literal":"とは","text":"分類とは、単なる名前づけではない。","line":105,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる"]},{"unit":"SAT:4.7.1.1","phase":"SAT","literal":"とは","text":"外的時空とは、物理的・社会的に共有される時間空間順序である。","line":169,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.7.1.2","phase":"SAT","literal":"とは","text":"内在時間とは、履歴場内部において、意味・反応・残差が更新される順序である。","line":171,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.7.1.3","phase":"SAT","literal":"とは","text":"エントロピー時間とは、差異・ノイズ・未統合残差が、閉鎖・保留・再符号化・切断へ向かう処理方向である。","line":173,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.7.1.4","phase":"SAT","literal":"とは","text":"論理-深度軸とは、外的時間の前後ではなく、未解決・矛盾・分岐・残差・意味圧をどれだけ保持し、再構成できるかを示す深度方向である。","line":175,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけ"]},{"unit":"SAT:5.1","phase":"SAT","literal":"とは","text":"理性とは、未閉鎖の入力・分類・判断を、より大きな内部ループへ統合しようとする力である。","line":185,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.8.1","phase":"SAT","literal":"とは","text":"偽閉鎖とは、未解決であるものを、解決済みのように扱うことである。","line":201,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.8.2","phase":"SAT","literal":"とは","text":"理性の暴走とは、内部ループの閉鎖欲が、外部同期と照合を失った状態である。","line":203,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.9","phase":"SAT","literal":"とは","text":"批判とは、理性を否定することではない。","line":205,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.10","phase":"SAT","literal":"とは","text":"批判とは、理性が正当に閉じられる範囲と、閉じてはならない範囲を区別することである。","line":207,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.11","phase":"SAT","literal":"とは","text":"理性の成熟とは、閉じる力を持ちながら、閉じてはならない残差を保持できることである。","line":209,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.12","phase":"SAT","literal":"とは","text":"理性の未成熟とは、未閉鎖を嫌い、残差を偽閉鎖することである。","line":211,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:6.1","phase":"SAT","literal":"とは","text":"法則とは、外部から与えられた絶対命令ではない。","line":217,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:6.2","phase":"SAT","literal":"とは","text":"法則とは、単なる主観的な思い込みでもない。","line":219,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる"]},{"unit":"SAT:6.3","phase":"SAT","literal":"とは","text":"法則とは、外部経験との同期可能性を持つ、高安定のヒューリスティック体系である。","line":221,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:6.4","phase":"SAT","literal":"とは","text":"ヒューリスティックとは、経験を圧縮し、次の判断に使える形へ閉じた理解である。","line":223,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["次の"]},{"unit":"SAT:6.5.2","phase":"SAT","literal":"とは","text":"法則体系の批判とは、法則の成立条件・同期条件・適用範囲・更新条件を問うことである。","line":241,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:7.1","phase":"SAT","literal":"とは","text":"内部ヒューリスティックとは、履歴場が外部を受け取り、分類し、判断するための内部構造である。","line":251,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:7.2","phase":"SAT","literal":"とは","text":"外部ヒューリスティックとは、観測、実験、言語、数式、制度、文献、AI、共同体検証などとして外部化された判断構造である。","line":253,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:7.3","phase":"SAT","literal":"とは","text":"同期とは、内部ヒューリスティックと外部ヒューリスティックが、運用上安定して対応することである。","line":255,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["運用上"]},{"unit":"SAT:8.1","phase":"SAT","literal":"とは","text":"照合とは、同期の成否だけでなく、一致・不一致・残差が何を意味するかを読む操作である。","line":283,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけでなく"]},{"unit":"SAT:9.5","phase":"SAT","literal":"とは","text":"残差とは、単なる未解決問題ではない。","line":327,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる"]},{"unit":"SAT:9.5.1","phase":"SAT","literal":"とは","text":"残差とは、同期・照合・分類・観測の過程で現れる、まだ再照合可能な差分である。","line":329,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["まだ"]},{"unit":"SAT:9.5.2","phase":"SAT","literal":"とは","text":"残渣とは、処理・分類・制度化・交換・説明のあとに残り、しばしば不可視化されながらも、なお場に作用し続ける履歴的沈殿である。","line":331,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.9","phase":"SAT","literal":"とは","text":"すべての残差を保持することは、認識をカオスへ戻す。","line":353,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["すべて"]},{"unit":"SAT:9.10","phase":"SAT","literal":"とは","text":"残差保持とは、残差を閉じず、捨てず、かつ無制限に氾濫させないための境界操作である。","line":355,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.11.1","phase":"SAT","literal":"とは","text":"創発とは、無からの出現ではなく、既存の分類体系で閉じられなかった残差が、再照合によって新しい分類形式を要求することである。","line":359,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.12","phase":"SAT","literal":"とは","text":"嘘とは、単なる偽命題ではない。","line":361,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる"]},{"unit":"SAT:9.12.1","phase":"SAT","literal":"とは","text":"嘘とは、照合経路を切断し、残差へのアクセスを塞ぐ操作である。","line":363,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.13","phase":"SAT","literal":"とは","text":"搾取とは、制度上の同期を維持しながら、負荷・責任・痛み・未来機会を残差として外部化する操作である。","line":365,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.14","phase":"SAT","literal":"とは","text":"環境問題とは、経済的同期から排除された自然・身体・未来世代の残渣が、場の反応として戻ってくる問題である。","line":367,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.15","phase":"SAT","literal":"とは","text":"AIの偽閉鎖とは、未解決残差を回答形式で閉じたように見せることである。","line":369,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.17","phase":"SAT","literal":"とは","text":"知るとは、残差を消し切ることではない。","line":377,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.17.1","phase":"SAT","literal":"とは","text":"知るとは、残差を保持したまま、判断可能性を維持することである。","line":379,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:10.5","phase":"SAT","literal":"とは","text":"真とは、命題が事実に単純対応することだけではない。","line":399,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけ"]},{"unit":"SAT:10.5.1","phase":"SAT","literal":"とは","text":"真とは、ある命題が、特定の履歴場において、特定の外部ヒューリスティックと照合され、判断可能性を保つ状態である。","line":401,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["特定の","特定の"]},{"unit":"SAT:10.6","phase":"SAT","literal":"とは","text":"偽とは、単なる不一致ではない。","line":403,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる"]},{"unit":"SAT:10.6.1","phase":"SAT","literal":"とは","text":"偽とは、同期不能、照合不能、適用範囲逸脱、分類失敗、または偽閉鎖として現れる。","line":405,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:10.7","phase":"SAT","literal":"とは","text":"未解決とは、偽ではない。","line":407,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:10.7.1","phase":"SAT","literal":"とは","text":"未解決とは、照合が閉じていない状態である。","line":409,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:11.1","phase":"SAT","literal":"とは","text":"学問とは、知識の保管庫ではない。","line":419,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:11.2","phase":"SAT","literal":"とは","text":"学問とは、内部ヒューリスティックと外部ヒューリスティックの同期を試みる営みである。","line":421,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:11.3","phase":"SAT","literal":"とは","text":"したがって、学問とは、同期と照合の継承可能な形式である。","line":435,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:12.5","phase":"SAT","literal":"と呼ぶ","text":"言語は、何を問題と呼び、何を説明と呼び、何を証明と呼び、何を冗談と呼び、何を失礼と呼ぶかを同期させる。","line":463,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:12.6","phase":"SAT","literal":"とは","text":"言語ゲームとは、共同体内で安定化した照合規則である。","line":465,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:12.9","phase":"SAT","literal":"とは","text":"通約とは、異なる言語ゲームの間に照合可能な対応面を作ることである。","line":473,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:12.9.3","phase":"SAT","literal":"とは","text":"通約とは、差異を消すことではなく、照合可能な境界面を作ることである。","line":479,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:14.19","phase":"SAT","literal":"とは","text":"経験を増やすことは、有限な観測者の解像度を上げうる。","line":563,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:15.12","phase":"SAT","literal":"とは","text":"知るとは、世界を所有することではない。","line":603,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:15.12.1","phase":"SAT","literal":"とは","text":"知るとは、境界で接触し、同期し、照合し、残差を保持しながら、次の判断可能性を開くことである。","line":605,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["次の"]},{"unit":"RAJ:L36:S1","phase":"RAJ","literal":"とは","text":"認識軸とは、この生成運動が履歴の中で安定した方向である。","line":36,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L105:S1","phase":"RAJ","literal":"とは","text":"認識軸とは、エントロピー属性を帯びた差分が観測者の境界に接触し、関心と捨象を通じて感性と悟性の編成を変化させ、価値とコストの重みづけ、残差、反復を経て、安定した観測方向として形成されるものである。","line":105,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L131:S1","phase":"RAJ","literal":"とは","text":"認識軸とは、観測者が世界を読む際に、ある差分を前景化し、別の差分を背景化し、一定の形式で対象・因果・責任・価値を組み立てやすくなる方向である。","line":131,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L141:S1","phase":"RAJ","literal":"とは","text":"本稿でいう差分とは、観測者の境界に接触し、何らかの反応、違和感、関心、切断、意味圧、残差を生じさせるものを指す。","line":141,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L141:S1","phase":"RAJ","literal":"を指す","text":"本稿でいう差分とは、観測者の境界に接触し、何らかの反応、違和感、関心、切断、意味圧、残差を生じさせるものを指す。","line":141,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L149:S1","phase":"RAJ","literal":"と呼ぶ","text":"本稿では、差分が境界で示す次のような性質を、エントロピー属性と呼ぶ。","line":149,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["次の"]},{"unit":"RAJ:L173:S1","phase":"RAJ","literal":"とは","text":"関心とは、差分を保持し、追跡し、解像度を与えようとする方向である。","line":173,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L188:S1","phase":"RAJ","literal":"とは","text":"ある差分へ強く関心を向けることは、別の差分を捨象する条件にもなる。","line":188,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L196:S1","phase":"RAJ","literal":"とは","text":"捨象とは、差分を保持しない、背景化する、切断する、保留する、または別の処理へ送る方向である。","line":196,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L200:S1","phase":"RAJ","literal":"とは","text":"すべてを見ることはできない。","line":200,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["すべて"]},{"unit":"RAJ:L278:S1","phase":"RAJ","literal":"とは","text":"価値とは、保持するに値すると前もって重みづけられた差分である。","line":278,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L280:S1","phase":"RAJ","literal":"とは","text":"コストとは、その価値を保持するために、負荷、遅延、例外、ノイズ、犠牲、処理対象として配分される差分である。","line":280,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L344:S1","phase":"RAJ","literal":"と呼ぶ","text":"この安定した観測方向を、認識軸と呼ぶ。","line":344,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L429:S1","phase":"RAJ","literal":"とは","text":"何かが見えることと、それが意味になることは同じではない。","line":429,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L559:S1","phase":"RAJ","literal":"とは","text":"認識軸とは、この反復によって安定した観測方向である。","line":559,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"TAM:L78:S1","phase":"TAM","literal":"とは","text":"ここでいう選択公理とは、世界を読むときに、何を第一に置き、何を証拠とし、何を実在的に扱い、何を背景へ送り、どの価値を守るかを決める認識上の選択点である。","line":78,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L90:S1","phase":"TAM","literal":"と呼ぶ","text":"本稿で「モジュール」と呼ぶのは、そのためである。","line":90,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L169:S1","phase":"TAM","literal":"とは","text":"関心とは、その体系が何を現実として強く見るかである。","line":169,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L189:S1","phase":"TAM","literal":"とは","text":"捨象とは、その体系が扱わないもの、背景化するもの、切断するもの、別の処理へ送るものである。","line":189,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L204:S1","phase":"TAM","literal":"とは","text":"価値とは、その体系が保持すべきものとして明示する差分である。","line":204,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L228:S1","phase":"TAM","literal":"とは","text":"コストとは、その価値を保持するために負荷として処理される差分である。","line":228,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L285:S1","phase":"TAM","literal":"とは","text":"接続性が高いことは、正しさまたは優越を意味しない。","line":285,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L337:S1","phase":"TAM","literal":"とは","text":"同じ体系が複数レイヤーに現れることはある。","line":337,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L489:S1","phase":"TAM","literal":"とは","text":"非互換であっても、相手が何を見せるかを照合することはできる。","line":489,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["であっても"]},{"unit":"TAM:L809:S1","phase":"TAM","literal":"とは","text":"通約とは、すべてを一つに統合することではない。","line":809,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["すべて"]}],"ESTABLISH":[{"unit":"SAT:0.2","phase":"SAT","literal":"成立する","text":"知とは、履歴を持つ存在が、外部からの入力を受け取り、内部で処理し、外部と同期し、その一致・不一致・残差を照合し、なお閉じきれないものを保持しながら、次の判断可能性を維持することで成立する。","line":21,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["次の"]},{"unit":"SAT:1.5","phase":"SAT","literal":"成立しない","text":"したがって、認識は境界なしには成立しない。","line":55,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:3.4.1","phase":"SAT","literal":"成立する","text":"同じ入力でも、異なる履歴場では異なる対象として成立する。","line":111,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:15.1","phase":"SAT","literal":"成立しない","text":"知は、内部と外部のどちらか一方だけでは成立しない。","line":577,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["一方","だけ"]},{"unit":"RAJ:L220:S1","phase":"RAJ","literal":"成立して","text":"したがって、認識軸を照合するときには、何を見ているかだけでなく、何を見ないことでその世界像が成立しているかを問う必要がある。","line":220,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["だけでなく"]},{"unit":"RAJ:L403:S1","phase":"RAJ","literal":"成立しない","text":"認識軸の変形は、外部からの命令だけでは成立しない。","line":403,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["だけ"]},{"unit":"TAM:L120:S1","phase":"TAM","literal":"成立しない","text":"反射：相手の体系内では受信条件が成立しない。","line":120,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L193:S1","phase":"TAM","literal":"成立しない","text":"認識は、何かを捨象しなければ成立しない。","line":193,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L658:S1","phase":"TAM","literal":"成立する","text":"何を観測可能にし、何を形式化し、どの境界で標準定義が成立するかという認識上の働きを比較対象にする。","line":658,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]}],"NEGATE":[{"unit":"SAT:0.1","phase":"SAT","literal":"しない","text":"本稿は、知を、主体内部の認識形式にも、外部事実への単純対応にも還元しない。","line":19,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:0.2.1","phase":"SAT","literal":"ではない","text":"したがって、認識とは「世界をそのまま写すこと」ではない。","line":23,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:0.3.2","phase":"SAT","literal":"ではない","text":"境界認識批判は、すべてを観測可能にするための観測理論ではない。","line":33,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["すべて"]},{"unit":"SAT:1.1","phase":"SAT","literal":"ではない","text":"存在は、単なる物ではない。","line":41,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる"]},{"unit":"SAT:1.2.1","phase":"SAT","literal":"ではなく","text":"履歴とは、単なる過去ではなく、次の受け取り方・反応・判断・意味づけを変えるものである。","line":45,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる","次の"]},{"unit":"SAT:1.4.1","phase":"SAT","literal":"ではない","text":"境界は、防壁ではない。","line":51,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:1.5.2","phase":"SAT","literal":"できない","text":"境界の弱すぎる認識は、外部入力と内部履歴を区別できない。","line":59,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:1.6","phase":"SAT","literal":"ではなく","text":"境界認識批判は、境界を消すのではなく、境界の位置・硬さ・開閉・残差保持条件を問う。","line":65,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:2.5","phase":"SAT","literal":"ではない","text":"したがって、感性は単なる受動的な器ではない。","line":79,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる"]},{"unit":"SAT:2.6.1","phase":"SAT","literal":"ではなく","text":"感性は、外部入力をそのまま受け取るのではなく、内部履歴に応じて受け取り可能な形へ切り出す。","line":83,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:2.6.1.2","phase":"SAT","literal":"ではない","text":"しかし、切り出されなかったものは消えたわけではない。","line":87,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:2.8","phase":"SAT","literal":"ならない","text":"感性の研究は、何が現れないまま作用するかを問わなければならない。","line":93,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:2.9","phase":"SAT","literal":"しない","text":"感性の失敗は、受け取れないものを存在しないものと誤認することである。","line":95,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:3.2","phase":"SAT","literal":"ではない","text":"分類とは、単なる名前づけではない。","line":105,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる"]},{"unit":"SAT:3.4.2","phase":"SAT","literal":"ではなく","text":"したがって、カテゴリーは固定された表ではなく、履歴場が外部同期のために用いる分類演算子として再構成される。","line":113,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:3.5.1","phase":"SAT","literal":"ではない","text":"ただし、悟性は万能ではない。","line":117,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["ただし"]},{"unit":"SAT:3.5.2","phase":"SAT","literal":"できない","text":"分類できないものを無理に分類すると、誤認が起こる。","line":119,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:3.5.3","phase":"SAT","literal":"できない","text":"分類できないものを存在しないものとして扱うと、履歴切断が起こる。","line":121,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:3.5.3","phase":"SAT","literal":"しない","text":"分類できないものを存在しないものとして扱うと、履歴切断が起こる。","line":121,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.1","phase":"SAT","literal":"ではない","text":"感性と悟性は、単なる心理能力ではない。","line":137,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる"]},{"unit":"SAT:4.5.1.1","phase":"SAT","literal":"ではなく","text":"境界認識批判におけるヒルベルト空間への関心は、物理状態の再計算ではなく、何が状態化され、何が射影から漏れるかにある。","line":149,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.5.3.1","phase":"SAT","literal":"ではなく","text":"境界認識批判におけるエントロピー空間への関心は、ノイズを消すことではなく、ノイズがどの境界不整合を示すかを読むことにある。","line":157,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.6","phase":"SAT","literal":"ではない","text":"境界認識批判にとって重要なのは、これらの空間がエネルギーをどう扱うかではない。","line":159,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.7.1.4","phase":"SAT","literal":"ではなく","text":"論理-深度軸とは、外的時間の前後ではなく、未解決・矛盾・分岐・残差・意味圧をどれだけ保持し、再構成できるかを示す深度方向である。","line":175,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけ"]},{"unit":"SAT:5.9","phase":"SAT","literal":"ではない","text":"批判とは、理性を否定することではない。","line":205,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.10","phase":"SAT","literal":"ならない","text":"批判とは、理性が正当に閉じられる範囲と、閉じてはならない範囲を区別することである。","line":207,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.11","phase":"SAT","literal":"ならない","text":"理性の成熟とは、閉じる力を持ちながら、閉じてはならない残差を保持できることである。","line":209,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:6.1","phase":"SAT","literal":"ではない","text":"法則とは、外部から与えられた絶対命令ではない。","line":217,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:7.3.5","phase":"SAT","literal":"しない","text":"しかし、同期だけでは知は完結しない。","line":265,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけ"]},{"unit":"SAT:7.3.6","phase":"SAT","literal":"しない","text":"同期は、一致の意味を説明しない。","line":267,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:7.3.7","phase":"SAT","literal":"しない","text":"同期は、不一致の意味を説明しない。","line":269,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:7.3.8","phase":"SAT","literal":"しない","text":"同期は、残差が何を示しているかを説明しない。","line":271,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:8.2","phase":"SAT","literal":"ではない","text":"照合は、単なる比較ではない。","line":285,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる"]},{"unit":"SAT:8.5","phase":"SAT","literal":"ではない","text":"残差は、失敗ではない。","line":301,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:8.8","phase":"SAT","literal":"ではなく","text":"照合の過剰は、残差保持ではなく、残差の意味強制になる。","line":311,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.4","phase":"SAT","literal":"ではない","text":"しかし、照合されたもののすべてが閉じられるわけではない。","line":323,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["すべて"]},{"unit":"SAT:9.5","phase":"SAT","literal":"ではない","text":"残差とは、単なる未解決問題ではない。","line":327,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる"]},{"unit":"SAT:9.7","phase":"SAT","literal":"ならない","text":"したがって、残差を即座に廃棄してはならない。","line":349,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.8","phase":"SAT","literal":"ならない","text":"しかし、残差をすべて保持してもならない。","line":351,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["すべて"]},{"unit":"SAT:9.11.1","phase":"SAT","literal":"ではなく","text":"創発とは、無からの出現ではなく、既存の分類体系で閉じられなかった残差が、再照合によって新しい分類形式を要求することである。","line":359,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.12","phase":"SAT","literal":"ではない","text":"嘘とは、単なる偽命題ではない。","line":361,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる"]},{"unit":"SAT:9.15.1","phase":"SAT","literal":"ではなく","text":"有用なAIは、残差を消すのではなく、残差へのアクセス経路を保つ。","line":371,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.16","phase":"SAT","literal":"ではない","text":"境界認識批判の中心は、すべてを観測することではない。","line":373,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["すべて"]},{"unit":"SAT:9.16.1","phase":"SAT","literal":"できない","text":"境界認識批判の中心は、観測できないもの、観測されなかったもの、観測した瞬間に変質するもの、観測体系から漏れるものを、残差として扱う条件を問うことである。","line":375,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.17","phase":"SAT","literal":"ではない","text":"知るとは、残差を消し切ることではない。","line":377,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:10.5","phase":"SAT","literal":"ではない","text":"真とは、命題が事実に単純対応することだけではない。","line":399,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけ"]},{"unit":"SAT:10.6","phase":"SAT","literal":"ではない","text":"偽とは、単なる不一致ではない。","line":403,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる"]},{"unit":"SAT:10.7","phase":"SAT","literal":"ではない","text":"未解決とは、偽ではない。","line":407,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:11.1","phase":"SAT","literal":"ではない","text":"学問とは、知識の保管庫ではない。","line":419,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:11.2.1","phase":"SAT","literal":"ならない","text":"ただし、同期だけでは学問にならない。","line":423,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["ただし","だけ"]},{"unit":"SAT:11.5","phase":"SAT","literal":"ではない","text":"学問は、残差を消し切るための制度ではない。","line":447,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:12.1","phase":"SAT","literal":"ではない","text":"言語は、意味を運ぶだけではない。","line":455,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけ"]},{"unit":"SAT:12.8","phase":"SAT","literal":"ではない","text":"したがって、誤解は単なる情報不足ではない。","line":469,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる"]},{"unit":"SAT:12.9.3","phase":"SAT","literal":"ではなく","text":"通約とは、差異を消すことではなく、照合可能な境界面を作ることである。" い","text":"接続性が高いことは、正しさまたは優越を意味しない。","line":285,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L300:S1","phase":"TAM","literal":"ではなくなる","text":"Core Invariant：失うと、その体系ではなくなる中核。","line":300,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L303:S1","phase":"TAM","literal":"とは限らない","text":"たとえば、ある思想の名称が維持されていても、その中核的な関心、捨象、価値、コストが反転していれば、同じ体系とは限らない。","line":303,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["とは限らない"]},{"unit":"TAM:L307:S1","phase":"TAM","literal":"ではない","text":"Core Invariant は、教義を絶対化するための語ではない。","line":307,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L311:S1","phase":"TAM","literal":"ではない","text":"Operational Drift は、逸脱を責めるための語ではない。","line":311,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L321:S1","phase":"TAM","literal":"ではない","text":"これは価値の上下関係ではない。","line":321,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L341:S1","phase":"TAM","literal":"ではなく","text":"その場合、同じ名称を一つの箱へ押し込めるのではなく、どの問いに対するモジュールとして用いているかを明示する。","line":341,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["場合"]},{"unit":"TAM:L391:S1","phase":"TAM","literal":"ではなく","text":"これにより、AIはモジュール名の近さではなく、型付きの関係によって文書を接続できる。","line":391,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L409:S1","phase":"TAM","literal":"ではなく","text":"語彙ではなく、関心、捨象、価値、コストの組み合わせを見る。","line":409,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L429:S1","phase":"TAM","literal":"しない","text":"照合手続きが異なる場合、結論だけを直接比較しない。","line":429,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_
