am_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]}],"PREDICATE":[{"unit":"SAT:0.3","phase":"SAT","literal":"である","text":"認識とは、境界において、内部ヒューリスティックと外部ヒューリスティックが接触し、同期し、照合され、残差を残しながら更新される過程である。","line":27,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:0.3.1.1","phase":"SAT","literal":"である","text":"この意味で、本稿は境界認識批判である。","line":31,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:1.2.1","phase":"SAT","literal":"である","text":"履歴とは、単なる過去ではなく、次の受け取り方・反応・判断・意味づけを変えるものである。","line":45,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["単なる","次の"]},{"unit":"SAT:1.4.2","phase":"SAT","literal":"である","text":"境界は、外部入力と内部履歴が接触し、通過・保留・遮断・再符号化・反射・更新される面である。","line":53,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:2.1","phase":"SAT","literal":"である","text":"感性とは、外部入力が履歴場に到達したとき、何が信号として立ち上がるかを決める受容構造である。","line":71,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:2.6","phase":"SAT","literal":"である","text":"感性は、履歴に準拠した受容ヒューリスティックである。","line":81,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:2.9","phase":"SAT","literal":"である","text":"感性の失敗は、受け取れないものを存在しないものと誤認することである。","line":95,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:2.10","phase":"SAT","literal":"である","text":"感性の過剰は、すべてのノイズを意味として受け取り、境界を過熱させることである。","line":97,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["すべて"]},{"unit":"SAT:3.1","phase":"SAT","literal":"である","text":"悟性とは、入力を判断可能な対象へ変換する分類構造である。","line":103,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:3.3","phase":"SAT","literal":"とする","text":"分類は、何を対象とし、何を背景とし、何を関係とし、何を原因とし、何を責任とし、何を価値とするかを決める。","line":107,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:3.5.3","phase":"SAT","literal":"として扱う","text":"分類できないものを存在しないものとして扱うと、履歴切断が起こる。","line":121,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:3.8","phase":"SAT","literal":"である","text":"分類不能性は、失敗である場合がある。","line":127,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["場合"]},{"unit":"SAT:3.10","phase":"SAT","literal":"である","text":"悟性の暴走は、分類できるものだけを存在と誤認することである。","line":131,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけ"]},{"unit":"SAT:4.5.1","phase":"SAT","literal":"である","text":"ヒルベルト空間は、状態・射影・観測断面を考えるための形式空間である。","line":147,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.5.2","phase":"SAT","literal":"である","text":"rigged Hilbert 空間は、通常の状態空間では閉じにくい一般化状態・境界状態・連続的対象を扱うための拡張空間である。","line":151,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.5.3","phase":"SAT","literal":"である","text":"エントロピー空間は、分布・散逸・圧縮・ノイズ・未統合残差を扱うための空間である。","line":155,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.6.1","phase":"SAT","literal":"である","text":"それは物理学の仕事である。","line":161,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.6.2","phase":"SAT","literal":"である","text":"境界認識批判が追うべきなのは、各形式空間が何を状態化し、何を観測可能にし、何を分類不能にし、何をノイズ・残差・意味圧として漏出させるかである。","line":163,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.7.1.1","phase":"SAT","literal":"である","text":"外的時空とは、物理的・社会的に共有される時間空間順序である。","line":169,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.7.1.2","phase":"SAT","literal":"である","text":"内在時間とは、履歴場内部において、意味・反応・残差が更新される順序である。","line":171,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.7.1.3","phase":"SAT","literal":"である","text":"エントロピー時間とは、差異・ノイズ・未統合残差が、閉鎖・保留・再符号化・切断へ向かう処理方向である。","line":173,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.7.1.4","phase":"SAT","literal":"である","text":"論理-深度軸とは、外的時間の前後ではなく、未解決・矛盾・分岐・残差・意味圧をどれだけ保持し、再構成できるかを示す深度方向である。","line":175,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけ"]},{"unit":"SAT:4.8","phase":"SAT","literal":"である","text":"存在境界論の主たる探究対象は、この形式空間と時間軸の交差において、認識・意味・観測・ノイズ・残差がどのように立ち上がるかである。","line":177,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.1","phase":"SAT","literal":"とする","text":"理性とは、未閉鎖の入力・分類・判断を、より大きな内部ループへ統合しようとする力である。","line":185,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.1","phase":"SAT","literal":"である","text":"理性とは、未閉鎖の入力・分類・判断を、より大きな内部ループへ統合しようとする力である。","line":185,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.6","phase":"SAT","literal":"である","text":"したがって、理性は有用である。","line":195,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.8","phase":"SAT","literal":"とする","text":"理性が外部同期可能な範囲を越えて内部ループを閉じようとすると、偽閉鎖が起こる。","line":199,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.8.1","phase":"SAT","literal":"である","text":"偽閉鎖とは、未解決であるものを、解決済みのように扱うことである。","line":201,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.8.1","phase":"SAT","literal":"である","text":"偽閉鎖とは、未解決であるものを、解決済みのように扱うことである。","line":201,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.8.2","phase":"SAT","literal":"である","text":"理性の暴走とは、内部ループの閉鎖欲が、外部同期と照合を失った状態である。","line":203,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.10","phase":"SAT","literal":"である","text":"批判とは、理性が正当に閉じられる範囲と、閉じてはならない範囲を区別することである。","line":207,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.11","phase":"SAT","literal":"である","text":"理性の成熟とは、閉じる力を持ちながら、閉じてはならない残差を保持できることである。","line":209,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:5.12","phase":"SAT","literal":"である","text":"理性の未成熟とは、未閉鎖を嫌い、残差を偽閉鎖することである。","line":211,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:6.3","phase":"SAT","literal":"である","text":"法則とは、外部経験との同期可能性を持つ、高安定のヒューリスティック体系である。","line":221,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:6.4","phase":"SAT","literal":"である","text":"ヒューリスティックとは、経験を圧縮し、次の判断に使える形へ閉じた理解である。","line":223,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["次の"]},{"unit":"SAT:6.4.3.1","phase":"SAT","literal":"である","text":"物理法則は、その中でも、外的時空内で極めて高い同期精度を持つ法則体系である。","line":231,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:6.5.2","phase":"SAT","literal":"である","text":"法則体系の批判とは、法則の成立条件・同期条件・適用範囲・更新条件を問うことである。","line":241,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:7.1","phase":"SAT","literal":"である","text":"内部ヒューリスティックとは、履歴場が外部を受け取り、分類し、判断するための内部構造である。","line":251,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:7.2","phase":"SAT","literal":"である","text":"外部ヒューリスティックとは、観測、実験、言語、数式、制度、文献、AI、共同体検証などとして外部化された判断構造である。","line":253,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:7.3","phase":"SAT","literal":"である","text":"同期とは、内部ヒューリスティックと外部ヒューリスティックが、運用上安定して対応することである。","line":255,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["運用上"]},{"unit":"SAT:7.3.1","phase":"SAT","literal":"である","text":"同期は、機能の条件である。","line":257,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:7.5","phase":"SAT","literal":"である","text":"同期だけを重視すると、機能するものだけが真であるかのように見える。","line":275,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけ","だけ"]},{"unit":"SAT:8.1","phase":"SAT","literal":"である","text":"照合とは、同期の成否だけでなく、一致・不一致・残差が何を意味するかを読む操作である。","line":283,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけでなく"]},{"unit":"SAT:8.4.1","phase":"SAT","literal":"である","text":"不一致は、誤りである場合がある。","line":291,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["場合"]},{"unit":"SAT:8.5.1","phase":"SAT","literal":"である","text":"残差は、未処理の意味である。","line":303,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:8.5.2","phase":"SAT","literal":"である","text":"残差は、次の問いの発生源である。","line":305,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["次の"]},{"unit":"SAT:8.7","phase":"SAT","literal":"とする","text":"照合だけを絶対化すると、すべての残差を何らかの意味として閉じようとする。","line":309,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけ","すべて"]},{"unit":"SAT:9.5.1","phase":"SAT","literal":"である","text":"残差とは、同期・照合・分類・観測の過程で現れる、まだ再照合可能な差分である。","line":329,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["まだ"]},{"unit":"SAT:9.5.2","phase":"SAT","literal":"である","text":"残渣とは、処理・分類・制度化・交換・説明のあとに残り、しばしば不可視化されながらも、なお場に作用し続ける履歴的沈殿である。","line":331,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.6.1","phase":"SAT","literal":"である","text":"残差は、見落としである場合がある。","line":339,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["場合"]},{"unit":"SAT:9.6.2","phase":"SAT","literal":"である","text":"残差は、抑圧である場合がある。","line":341,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["場合"]},{"unit":"SAT:9.6.3","phase":"SAT","literal":"である","text":"残差は、外部化された負債である場合がある。","line":343,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["場合"]},{"unit":"SAT:9.6.4","phase":"SAT","literal":"である","text":"残差は、未来の問いの発生源である場合がある。","line":345,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["場合"]},{"unit":"SAT:9.6.5","phase":"SAT","literal":"である","text":"残差は、現在の同期体系では照合不能な意味張力である場合がある。","line":347,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["場合"]},{"unit":"SAT:9.10","phase":"SAT","literal":"である","text":"残差保持とは、残差を閉じず、捨てず、かつ無制限に氾濫させないための境界操作である。","line":355,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.11.1","phase":"SAT","literal":"である","text":"創発とは、無からの出現ではなく、既存の分類体系で閉じられなかった残差が、再照合によって新しい分類形式を要求することである。","line":359,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.12.1","phase":"SAT","literal":"である","text":"嘘とは、照合経路を切断し、残差へのアクセスを塞ぐ操作である。","line":363,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.13","phase":"SAT","literal":"である","text":"搾取とは、制度上の同期を維持しながら、負荷・責任・痛み・未来機会を残差として外部化する操作である。","line":365,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.14","phase":"SAT","literal":"である","text":"環境問題とは、経済的同期から排除された自然・身体・未来世代の残渣が、場の反応として戻ってくる問題である。","line":367,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.15","phase":"SAT","literal":"である","text":"AIの偽閉鎖とは、未解決残差を回答形式で閉じたように見せることである。","line":369,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.16.1","phase":"SAT","literal":"として扱う","text":"境界認識批判の中心は、観測できないもの、観測されなかったもの、観測した瞬間に変質するもの、観測体系から漏れるものを、残差として扱う条件を問うことである。","line":375,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.16.1","phase":"SAT","literal":"である","text":"境界認識批判の中心は、観測できないもの、観測されなかったもの、観測した瞬間に変質するもの、観測体系から漏れるものを、残差として扱う条件を問うことである。","line":375,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.17.1","phase":"SAT","literal":"である","text":"知るとは、残差を保持したまま、判断可能性を維持することである。","line":379,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:10.5.1","phase":"SAT","literal":"である","text":"真とは、ある命題が、特定の履歴場において、特定の外部ヒューリスティックと照合され、判断可能性を保つ状態である。","line":401,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["特定の","特定の"]},{"unit":"SAT:10.7.1","phase":"SAT","literal":"である","text":"未解決とは、照合が閉じていない状態である。","line":409,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:10.8","phase":"SAT","literal":"である","text":"知にとって重要なのは、真偽だけでなく、真偽・意味・残差・更新可能性の配置である。","line":411,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけでなく"]},{"unit":"SAT:11.2","phase":"SAT","literal":"である","text":"学問とは、内部ヒューリスティックと外部ヒューリスティックの同期を試みる営みである。","line":421,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:11.3","phase":"SAT","literal":"である","text":"したがって、学問とは、同期と照合の継承可能な形式である。","line":435,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:11.3.1","phase":"SAT","literal":"である","text":"科学は、外部同期と再照合の強度が高い学問形式である。","line":437,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:11.3.2","phase":"SAT","literal":"である","text":"哲学は、同期と照合の成立条件そのものを問う学問形式である。","line":439,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:11.3.3","phase":"SAT","literal":"である","text":"形而上学は、入力・対象・意味・判断・存在が立ち上がる以前の条件を問う学問形式である。","line":441,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:11.3.4","phase":"SAT","literal":"である","text":"人文学は、履歴場における意味・解釈・言語ゲーム・価値の照合を扱う学問形式である。","line":443,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:11.5.1","phase":"SAT","literal":"である","text":"学問は、残差を再照合可能な形で保存し、未来の問いへ渡すための制度である。","line":449,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:12.6","phase":"SAT","literal":"である","text":"言語ゲームとは、共同体内で安定化した照合規則である。","line":465,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:12.9","phase":"SAT","literal":"である","text":"通約とは、異なる言語ゲームの間に照合可能な対応面を作ることである。","line":473,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:12.9.1","phase":"SAT","literal":"である","text":"完全翻訳は不要である。","line":475,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:12.9.2","phase":"SAT","literal":"である","text":"必要なのは、保存すべき核、変換可能な層、未決定の残差を分けることである。","line":477,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:12.9.3","phase":"SAT","literal":"である","text":"通約とは、差異を消すことではなく、照合可能な境界面を作ることである。","line":479,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:12.10","phase":"SAT","literal":"である","text":"言語ゲームの失敗は、残差を非常識・非合理・非存在として処分し、照合可能性を失わせることである。","line":481,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:12.10.1","phase":"SAT","literal":"として扱う","text":"残差をユーモアとして処理する、または誤解や誤謬として扱う場合には、照合の可能性が残される。","line":483,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["場合"]},{"unit":"SAT:13.5","phase":"SAT","literal":"である","text":"AIは、外部ヒューリスティックの増幅装置である。","line":497,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:13.8.1","phase":"SAT","literal":"である","text":"AIの危険は、未解決を閉じたように見せることである。","line":505,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:13.9.1","phase":"SAT","literal":"である","text":"AIの有用性は、判断可能性を保つことである。","line":509,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:13.10.1","phase":"SAT","literal":"である","text":"AI時代の批判哲学は、AIによって増幅された外部ヒューリスティックを、内部理解とどう同期し、どう照合するかを問うことである。","line":513,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:13.11.2","phase":"SAT","literal":"である","text":"有用なAIは、残差を消すAIではなく、残差へのアクセス経路を保つAIである。","line":519,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:14.9","phase":"SAT","literal":"である","text":"これらはすべて、境界の失敗である。","line":541,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["すべて"]},{"unit":"SAT:14.12","phase":"SAT","literal":"である","text":"境界認識批判は、知が正当に働く条件を固定するためのものである。","line":547,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:14.13","phase":"SAT","literal":"とする","text":"同期だけでよいとする態度は、残差を捨てる。","line":549,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけ"]},{"unit":"SAT:14.16","phase":"SAT","literal":"である","text":"履歴と切れたカオスは、残差が接続先を失った状態である。","line":555,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:14.21","phase":"SAT","literal":"である","text":"したがって、知の完成宣言は、最も強い偽閉鎖候補の一つである。","line":569,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:15.5","phase":"SAT","literal":"である","text":"感性と悟性は、履歴場の受容・分類ヒューリスティックである。","line":587,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:15.7","phase":"SAT","literal":"である","text":"法則は、外部同期可能な高安定ヒューリスティックである。","line":591,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:15.9","phase":"SAT","literal":"である","text":"学問は、同期と照合を再照合可能な形へ保存する営みである。","line":595,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:15.10","phase":"SAT","literal":"である","text":"言語ゲームは、共同体における照合規則である。","line":597,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:15.12.1","phase":"SAT","literal":"である","text":"知るとは、境界で接触し、同期し、照合し、残差を保持しながら、次の判断可能性を開くことである。","line":605,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["次の"]},{"unit":"SAT:15.13","phase":"SAT","literal":"である","text":"有限な観測者にとって、現在の到達は完成ではなく、再照合可能な仮閉鎖である。","line":607,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"RAJ:L14:S1","phase":"RAJ","literal":"である","text":"本文書は、存在境界論において、認識軸がどのように生成され、安定し、変形するかを扱う基幹ノートである。","line":14,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L16:S1","phase":"RAJ","literal":"である","text":"本稿が所有する問いは、次の一つである。","line":16,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["次の"]},{"unit":"RAJ:L24:S1","phase":"RAJ","literal":"である","text":"本稿が扱うのは、それらの条件のもとで、局所的な観測者の感性と悟性が、履歴、関心、捨象、価値、コスト、残差、反復によって、特定の方向へ編成されていく過程である。","line":24,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["特定の"]},{"unit":"RAJ:L26:S1","phase":"RAJ","literal":"である","text":"この意味で、本稿は認識の成立条件を扱う批判論ではなく、認識方向の生成を扱う動態論である。","line":26,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L30:S1","phase":"RAJ","literal":"として扱う","text":"本稿を Raj / Beauty に置くのは、認識を固定された鏡としてではなく、差分が関係を作り、選択され、背景化され、形を得ていく運動として扱うためである。","line":30,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L30:S1","phase":"RAJ","literal":"である","text":"本稿を Raj / Beauty に置くのは、認識を固定された鏡としてではなく、差分が関係を作り、選択され、背景化され、形を得ていく運動として扱うためである。","line":30,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L34:S1","phase":"RAJ","literal":"である","text":"それは、異なるものが接触し、あるものが前景となり、別のものが背景となり、世界が一つの認識可能な形を得る生成運動である。","line":34,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L36:S1","phase":"RAJ","literal":"である","text":"認識軸とは、この生成運動が履歴の中で安定した方向である。","line":36,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L61:S1","phase":"RAJ","literal":"である","text":"それは、ある観測者、組織、共同体、制度が、どの差分を拾い、どの差分を落とし、どの方向から世界を読むようになったかを再照合するための記述である。","line":61,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L103:S1","phase":"RAJ","literal":"である","text":"本稿の基本命題は、次の通りである。","line":103,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["次の"]},{"unit":"RAJ:L105:S1","phase":"RAJ","literal":"である","text":"認識軸とは、エントロピー属性を帯びた差分が観測者の境界に接触し、関心と捨象を通じて感性と悟性の編成を変化させ、価値とコストの重みづけ、残差、反復を経て、安定した観測方向として形成されるものである。","line":105,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L131:S1","phase":"RAJ","literal":"である","text":"認識軸とは、観測者が世界を読む際に、ある差分を前景化し、別の差分を背景化し、一定の形式で対象・因果・責任・価値を組み立てやすくなる方向である。","line":131,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L163:S1","phase":"RAJ","literal":"である","text":"それは、入力と観測者の履歴が接触する境界で生じる関係的性質である。","line":163,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L167:S1","phase":"RAJ","literal":"である","text":"ここで扱うのは、差分がどのように散り、集まり、保持され、切断され、次の認識条件を変えるかという存在境界論上の属性である。","line":167,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["次の"]},{"unit":"RAJ:L173:S1","phase":"RAJ","literal":"とする","text":"関心とは、差分を保持し、追跡し、解像度を与えようとする方向である。","line":173,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L173:S1","phase":"RAJ","literal":"である","text":"関心とは、差分を保持し、追跡し、解像度を与えようとする方向である。","line":173,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L190:S1","phase":"RAJ","literal":"である","text":"関心は開口であると同時に、視野の配分でもある。","line":190,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L196:S1","phase":"RAJ","literal":"である","text":"捨象とは、差分を保持しない、背景化する、切断する、保留する、または別の処理へ送る方向である。","line":196,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L213:S1","phase":"RAJ","literal":"とする","text":"何を背景とするか。","line":213,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L226:S1","phase":"RAJ","literal":"として扱う","text":"本稿では、感性を「何が感じられるかの開口」として扱う。","line":226,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L239:S1","phase":"RAJ","literal":"である","text":"差分を受け取る開口が変わったため、感じられる世界が変化したのである。","line":239,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L249:S1","phase":"RAJ","literal":"として扱う","text":"本稿では、悟性を「感じられたものが、どのような形式で対象・関係・因果・責任として整理されるかの編成」として扱う。","line":249,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L268:S1","phase":"RAJ","literal":"である","text":"悟性の暴走は、分類できるものだけを存在すると誤認することである。","line":268,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["だけ"]},{"unit":"RAJ:L270:S1","phase":"RAJ","literal":"である","text":"悟性の成熟は、分類不能なものを直ちに無とせず、残差として保持し、新しい分類形式または別の照合経路を待てることである。","line":270,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L278:S1","phase":"RAJ","literal":"である","text":"価値とは、保持するに値すると前もって重みづけられた差分である。","line":278,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L280:S1","phase":"RAJ","literal":"である","text":"コストとは、その価値を保持するために、負荷、遅延、例外、ノイズ、犠牲、処理対象として配分される差分である。","line":280,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L292:S1","phase":"RAJ","literal":"である","text":"それは、何を見るか、何を見ないかを左右する前反省的な重みづけである。","line":292,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L388:S1","phase":"RAJ","literal":"である","text":"問題は、どの条件で軸を切り替えているかを観測できるか、その切り替えによって誰にコストが移るかを照合できるかである。","line":388,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L401:S1","phase":"RAJ","literal":"である","text":"これらを確認し、必要なら関心、捨象、価値、コストの配分を組み替えることである。","line":401,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L413:S1","phase":"RAJ","literal":"として扱う","text":"組織も、何を問題として受け取り、何をノイズとして落とし、何を成果として計上し、何を外部コストとして扱うかという安定した観測方向を持つ。","line":413,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L423:S1","phase":"RAJ","literal":"である","text":"本稿が行うのは、それらを同一化することではなく、差分、関心、捨象、感性、悟性、価値、コスト、残差、反復という共通の観点から比較可能にすることである。","line":423,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L433:S1","phase":"RAJ","literal":"である","text":"しかし、差分が履歴へ統合され、返路を持ち、次の受け取り方を変える意味として閉じる条件は、意味生成モデルの主題である。","line":433,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["次の"]},{"unit":"RAJ:L462:S1","phase":"RAJ","literal":"である","text":"本稿から選択公理モジュールへ渡す最小出力は、次の通りである。","line":462,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["次の"]},{"unit":"RAJ:L481:S1","phase":"RAJ","literal":"とする","text":"認識は、身体を基盤とする観測者に現れる。","line":481,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L492:S1","phase":"RAJ","literal":"である","text":"これらの表現は、認識変化が自己にどう現れているかを記述する補助線として有効である。","line":492,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L498:S1","phase":"RAJ","literal":"として扱う","text":"身体性は、認識軸生成の単一原因ではなく、認識変化が局所的観測者に現れる一つの様態として扱う。","line":498,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L504:S1","phase":"RAJ","literal":"である","text":"本稿の公開中核は、差分、関心、捨象、感性、悟性、価値、コスト、残差、反復による認識軸生成である。","line":504,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L519:S1","phase":"RAJ","literal":"である","text":"ただし、この節は高強度の研究接続である。","line":519,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["ただし"]},{"unit":"RAJ:L538:S1","phase":"RAJ","literal":"である","text":"本稿が提示するのは、世界がどのように見え始め、何が見えなくなり、その方向がどのように履歴化されるかを照合するための概念モデルである。","line":538,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L559:S1","phase":"RAJ","literal":"である","text":"認識軸とは、この反復によって安定した観測方向である。","line":559,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L563:S1","phase":"RAJ","literal":"である","text":"それは、なぜこの世界がこのように見え、別の世界が見えにくくなっているのかを再照合するための履歴的な座標である。","line":563,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"TAM:L18:S1","phase":"TAM","literal":"である","text":"本文書は、異なる思想、世界観、学問、制度、技術設計、神話的体系を、関心、捨象、価値、コストの安定パターンとして比較し、通約可能性と翻訳不能残差を照合するための境界プロトコルである。","line":18,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L24:S1","phase":"TAM","literal":"である","text":"本稿が所有する問いは、次の一つである。","line":24,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["次の"]},{"unit":"TAM:L64:S1","phase":"TAM","literal":"である","text":"Goodness が引き受けるのは、思想の道徳的ランキングではなく、選択の反動と責任である。","line":64,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L78:S1","phase":"TAM","literal":"である","text":"ここでいう選択公理とは、世界を読むときに、何を第一に置き、何を証拠とし、何を実在的に扱い、何を背景へ送り、どの価値を守るかを決める認識上の選択点である。","line":78,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L90:S1","phase":"TAM","literal":"である","text":"本稿で「モジュール」と呼ぶのは、そのためである。","line":90,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L98:S1","phase":"TAM","literal":"である","text":"それは、認識を構成する選択点を、比較・通約・批判可能な形へ明示するための単位である。","line":98,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L114:S1","phase":"TAM","literal":"として扱う","text":"本稿は、思想間通信を次の境界操作として扱う。","line":114,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["次の"]},{"unit":"TAM:L124:S1","phase":"TAM","literal":"である","text":"この意味で、選択公理モジュールは思想一覧ではなく、認識境界における通信プロトコルである。","line":124,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L132:S1","phase":"TAM","literal":"である","text":"本稿が認識軸生成論から受け取る最小入力は、次の通りである。","line":132,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["次の"]},{"unit":"TAM:L145:S1","phase":"TAM","literal":"である","text":"本稿が真理の経営学、組織論、AI設計、社会設計へ渡す最小出力は、次の通りである。","line":145,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["次の"]},{"unit":"TAM:L169:S1","phase":"TAM","literal":"である","text":"関心とは、その体系が何を現実として強く見るかである。","line":169,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L189:S1","phase":"TAM","literal":"である","text":"捨象とは、その体系が扱わないもの、背景化するもの、切断するもの、別の処理へ送るものである。","line":189,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L204:S1","phase":"TAM","literal":"である","text":"価値とは、その体系が保持すべきものとして明示する差分である。","line":204,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L228:S1","phase":"TAM","literal":"である","text":"コストとは、その価値を保持するために負荷として処理される差分である。","line":228,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L233:S1","phase":"TAM","literal":"として扱う","text":"救済を守るために、現実世界への執着をコストとして扱う。","line":233,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L261:S1","phase":"TAM","literal":"である","text":"複数の読み手が、どこで評価を違えたかを照合するための暫定注記である。","line":261,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L294:S1","phase":"TAM","literal":"として扱う","text":"思想または世界観を、すべて流動的なものとして扱うと、何でも同じに見える。","line":294,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["すべて"]},{"unit":"TAM:L309:S1","phase":"TAM","literal":"である","text":"翻訳の過程で、何を失うと別の体系になるかを確認するための責任境界である。","line":309,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L313:S1","phase":"TAM","literal":"である","text":"運用条件が変わったとき、どこまで変形しても中核を保持できるかを見るための履歴層である。","line":313,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L325:S1","phase":"TAM","literal":"である","text":"異なる問いを同じ平面に置いて偽の対立を作らないための配置である。","line":325,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L425:S1","phase":"TAM","literal":"とする","text":"何を証拠とするか。","line":425,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L426:S1","phase":"TAM","literal":"とする","text":"何を反証とするか。","line":426,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L427:S1","phase":"TAM","literal":"として扱う","text":"何を体験、伝統、論理、測定、物語、制度履歴、ログとして扱うか。","line":427,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L437:S1","phase":"TAM","literal":"である","text":"通信可能性を作るための限定的なポートである。","line":437,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L509:S1","phase":"TAM","literal":"とする","text":"守ろうとする価値は近いが、制度、儀礼、証拠、手続きが異なる。","line":509,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L517:S1","phase":"TAM","literal":"とする","text":"同じ現象を扱っていても、測定、論証、体験、伝承、象徴、物語のどれを根拠とするかが異なる。","line":517,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L521:S1","phase":"TAM","literal":"として扱う","text":"形而上学的仮説を経験科学の結論として扱う。","line":521,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L522:S1","phase":"TAM","literal":"として扱う","text":"経験科学のモデルを倫理的命令として扱う。","line":522,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L523:S1","phase":"TAM","literal":"として扱う","text":"制度上の便宜を存在論的真理として扱う。","line":523,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L531:S1","phase":"TAM","literal":"である","text":"通約が成功したように見えても、元の体系が失われていれば偽の接続である。","line":531,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L537:S1","phase":"TAM","literal":"である","text":"以下は、認識ブリッジの動作を示すための代表配置である。","line":537,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L666:S1","phase":"TAM","literal":"である","text":"ここで重要なのは、採用ではなく、照合である。","line":666,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L730:S1","phase":"TAM","literal":"として読む","text":"自由、安全、成長、包摂、効率といった目的を、価値名だけでなく、捨象とコストの配分として読む。","line":730,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["だけでなく"]},{"unit":"TAM:L766:S1","phase":"TAM","literal":"である","text":"何が通約でき、何が通約できず、何を残差として保持すべきかを明示し、異なる境界のまま通信可能性を作ることである。","line":766,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L776:S1","phase":"TAM","literal":"である","text":"正本である本稿は、次を保持する。","line":776,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L803:S1","phase":"TAM","literal":"である","text":"それは、認識軸が世界観、方法、倫理、制度、技術設計として明示されたとき、異なる体系の間に通信ポートを作るための境界プロトコルである。","line":803,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L811:S1","phase":"TAM","literal":"である","text":"中核を確認し、照合手続きを比較し、共有可能なインターフェースを作り、翻訳不能残差を残し、原体系へ戻る返路を保持することである。","line":811,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L819:S1","phase":"TAM","literal":"である","text":"これが、認識ブリッジとしての選択公理モジュールの役割である。","line":819,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]}],"REQUIRE":[{"unit":"SAT:7.4","phase":"SAT","literal":"必要である","text":"したがって、同期には照合が必要である。","line":273,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:15.11.1","phase":"SAT","literal":"必要である","text":"したがって、AI時代には、境界認識批判が必要である。","line":601,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"RAJ:L220:S1","phase":"RAJ","literal":"必要がある","text":"したがって、認識軸を照合するときには、何を見ているかだけでなく、何を見ないことでその世界像が成立しているかを問う必要がある。","line":220,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["だけでなく"]},{"unit":"RAJ:L405:S1","phase":"RAJ","literal":"必要がある","text":"観測者自身が、既存軸では処理できない差分と残差を、再び受け取れる境界を持つ必要がある。","line":405,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"TAM:L117:S1","phase":"TAM","literal":"必要がある","text":"変換：別の語彙または形式へ写す必要がある。","line":117,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L644:S1","phase":"TAM","literal":"必要がある","text":"通約では、結論より先に、この処理差を確認する必要がある。","line":644,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]}],"RETAIN":[{"unit":"SAT:0.2","phase":"SAT","literal":"保持し","text":"知とは、履歴を持つ存在が、外部からの入力を受け取り、内部で処理し、外部と同期し、その一致・不一致・残差を照合し、なお閉じきれないものを保持しながら、次の判断可能性を維持することで成立する。","line":21,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["次の"]},{"unit":"SAT:0.2","phase":"SAT","literal":"維持する","text":"知とは、履歴を持つ存在が、外部からの入力を受け取り、内部で処理し、外部と同期し、その一致・不一致・残差を照合し、なお閉じきれないものを保持しながら、次の判断可能性を維持することで成立する。","line":21,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["次の"]},{"unit":"SAT:0.3","phase":"SAT","literal":"残し","text":"認識とは、境界において、内部ヒューリスティックと外部ヒューリスティックが接触し、同期し、照合され、残差を残しながら更新される過程である。","line":27,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:0.3.3","phase":"SAT","literal":"保持し","text":"境界認識批判は、有限観測系において、観測・分類・同期・照合から漏れるものを、どのように残差として保持し、再照合可能性を維持するかを問う。","line":35,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:0.3.3","phase":"SAT","literal":"維持する","text":"境界認識批判は、有限観測系において、観測・分類・同期・照合から漏れるものを、どのように残差として保持し、再照合可能性を維持するかを問う。","line":35,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.7.1.4","phase":"SAT","literal":"保持し","text":"論理-深度軸とは、外的時間の前後ではなく、未解決・矛盾・分岐・残差・意味圧をどれだけ保持し、再構成できるかを示す深度方向である。","line":175,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["だけ"]},{"unit":"SAT:8.6","phase":"SAT","literal":"保持する","text":"照合は、残差を意味の資源として保持する。","line":307,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.5.3","phase":"SAT","literal":"保持される","text":"残差は、問いとして保持される。","line":333,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.8","phase":"SAT","literal":"保持し","text":"しかし、残差をすべて保持してもならない。","line":351,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["すべて"]},{"unit":"SAT:9.9","phase":"SAT","literal":"保持する","text":"すべての残差を保持することは、認識をカオスへ戻す。","line":353,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":["すべて"]},{"unit":"SAT:9.13","phase":"SAT","literal":"維持し","text":"搾取とは、制度上の同期を維持しながら、負荷・責任・痛み・未来機会を残差として外部化する操作である。","line":365,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.17.1","phase":"SAT","literal":"保持し","text":"知るとは、残差を保持したまま、判断可能性を維持することである。","line":379,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:9.17.1","phase":"SAT","literal":"維持する","t Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L182:S1","phase":"RAJ","literal":"残し","text":"関心が境界へ向いていれば、誰のどの履歴に接触し、何を壊し、何を残したかが見える。","line":182,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L196:S1","phase":"RAJ","literal":"保持し","text":"捨象とは、差分を保持しない、背景化する、切断する、保留する、または別の処理へ送る方向である。","line":196,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L270:S1","phase":"RAJ","literal":"保持し","text":"悟性の成熟は、分類不能なものを直ちに無とせず、残差として保持し、新しい分類形式または別の照合経路を待てることである。","line":270,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L278:S1","phase":"RAJ","literal":"保持する","text":"価値とは、保持するに値すると前もって重みづけられた差分である。","line":278,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L280:S1","phase":"RAJ","literal":"保持する","text":"コストとは、その価値を保持するために、負荷、遅延、例外、ノイズ、犠牲、処理対象として配分される差分である。","line":280,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L335:S1","phase":"RAJ","literal":"保持し","text":"3. 関心が一部の差分を保持し、解像度を与える。","line":335,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L435:S1","phase":"RAJ","literal":"維持する","text":"したがって、次の区別を維持する。","line":435,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["次の"]},{"unit":"RAJ:L468:S1","phase":"RAJ","literal":"保持する","text":"どの差分を残差として保持するか","line":468,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L513:S1","phase":"RAJ","literal":"保持し","text":"論理-深度軸：外的時間の前後ではなく、未解決、矛盾、分岐、残差、意味圧をどれだけ保持し、再構成できるかを示す深度方向。","line":513,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":["だけ"]},{"unit":"RAJ:L517:S1","phase":"RAJ","literal":"保持し","text":"それは、どの差分へコミットし、どの意味ループを閉じ、どの残差を保持し、どの残渣を引き受けてきたかという履歴構造でもある。","line":517,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L523:S1","phase":"RAJ","literal":"残す","text":"この節の役割は、平面論理上で安定した認識軸が、どの深度履歴へ接続しているかを示すポートを残すことにある。","line":523,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L551:S1","phase":"RAJ","literal":"保持する","text":"何を価値として保持するか。","line":551,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L553:S1","phase":"RAJ","literal":"残す","text":"何を残差として残すか。","line":553,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"TAM:L138:S1","phase":"TAM","literal":"保持する","text":"何を残差として保持するか","line":138,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L150:S1","phase":"TAM","literal":"保持する","text":"価値を保持するために発生するコスト","line":150,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L228:S1","phase":"TAM","literal":"保持する","text":"コストとは、その価値を保持するために負荷として処理される差分である。","line":228,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L288:S1","phase":"TAM","literal":"保持し","text":"接続しにくい体系は、重要な差分を強く保持している場合もある。","line":288,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["場合"]},{"unit":"TAM:L389:S1","phase":"TAM","literal":"保持する","text":"ただし、内部YAMLまたは管理表では、少なくとも中核、運用差、残差処理、照合手続き、境界条件を保持する。","line":389,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["ただし","少なくとも"]},{"unit":"TAM:L453:S1","phase":"TAM","literal":"残す","text":"後から原体系へ戻れる返路を残す。","line":453,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L473:S1","phase":"TAM","literal":"保持する","text":"統合するのではなく、複数視点を保持することで解像度が上がる。","line":473,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L495:S1","phase":"TAM","literal":"保持し","text":"この場合、理解可能性を保持しながら、運用ポートは閉じることがある。","line":495,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":["場合"]},{"unit":"TAM:L670:S1","phase":"TAM","literal":"保存する","text":"どの価値を保存するのか。","line":670,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L700:S1","phase":"TAM","literal":"保持する","text":"価値を保持するためのコスト","line":700,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L738:S1","phase":"TAM","literal":"保持する","text":"物語世界の根源公理、認識方法、倫理、制度、象徴操作を分けて配置し、設定上の衝突と未解決点を保持する。","line":738,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L776:S1","phase":"TAM","literal":"保持する","text":"正本である本稿は、次を保持する。","line":776,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L805:S1","phase":"TAM","literal":"保持し","text":"各モジュールは、何に関心を向け、何を捨象し、何を価値として保持し、何をコストとして処理するかを持つ。","line":805,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L811:S1","phase":"TAM","literal":"残し","text":"中核を確認し、照合手続きを比較し、共有可能なインターフェースを作り、翻訳不能残差を残し、原体系へ戻る返路を保持することである。","line":811,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L811:S1","phase":"TAM","literal":"保持する","text":"中核を確認し、照合手続きを比較し、共有可能なインターフェースを作り、翻訳不能残差を残し、原体系へ戻る返路を保持することである。","line":811,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]}],"SELECT":[{"unit":"SAT:7.1","phase":"SAT","literal":"判断する","text":"内部ヒューリスティックとは、履歴場が外部を受け取り、分類し、判断するための内部構造である。","line":251,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"TAM:L56:S1","phase":"TAM","literal":"選ぶ","text":"本稿を Tam / Goodness に置くのは、善い思想を選ぶためではない。","line":56,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L58:S1","phase":"TAM","literal":"採用する","text":"認識形式を採用すると、必ず何かが前景化し、何かが捨象され、何かが価値として保存され、何かがコストとして処理される。","line":58,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L157:S1","phase":"TAM","literal":"選ぶ","text":"選択公理モジュールは、目的を選ぶ権限を持たない。","line":157,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L447:S1","phase":"TAM","literal":"判断する","text":"直接翻訳、条件つき翻訳、補完、緊張、直交、非互換、安全上の遮断のどれに当たるかを判断する。","line":447,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L813:S1","phase":"TAM","literal":"選ぶ","text":"認識形式を選ぶことには、責任が伴う。","line":813,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]}],"SUPPORT":[{"unit":"SAT:3.4","phase":"SAT","literal":"依存する","text":"分類の仕方は、履歴構造に依存する。","line":109,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"TAM:L148:S1","phase":"TAM","literal":"前提とする","text":"その目的が前提とする世界像","line":148,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]}],"TRANSFORM":[{"unit":"SAT:0.3","phase":"SAT","literal":"更新される","text":"認識とは、境界において、内部ヒューリスティックと外部ヒューリスティックが接触し、同期し、照合され、残差を残しながら更新される過程である。","line":27,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:1.4.2","phase":"SAT","literal":"更新される","text":"境界は、外部入力と内部履歴が接触し、通過・保留・遮断・再符号化・反射・更新される面である。","line":53,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:3.1","phase":"SAT","literal":"変換する","text":"悟性とは、入力を判断可能な対象へ変換する分類構造である。","line":103,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:3.5","phase":"SAT","literal":"変換する","text":"悟性は、感性によって切り出された入力を、判断可能な構造へ変換する。","line":115,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"SAT:4.7.1.2","phase":"SAT","literal":"更新される","text":"内在時間とは、履歴場内部において、意味・反応・残差が更新される順序である。","line":171,"source":"01_Sat_Truth/Boundary_Epistemological_Critique.ja.md","near_qualifiers":[]},{"unit":"RAJ:L14:S1","phase":"RAJ","literal":"変形する","text":"本文書は、存在境界論において、認識軸がどのように生成され、安定し、変形するかを扱う基幹ノートである。","line":14,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L18:S1","phase":"RAJ","literal":"形成される","text":"履歴を持つ観測者に差分が接触したとき、何が感じられ、何が理解可能になり、何が見えなくなるという方向性は、どのように形成されるのか。","line":18,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L80:S1","phase":"RAJ","literal":"形成される","text":"意見が形成される以前に、何が現実として感じられるかが異なっている。","line":80,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L105:S1","phase":"RAJ","literal":"形成される","text":"認識軸とは、エントロピー属性を帯びた差分が観測者の境界に接触し、関心と捨象を通じて感性と悟性の編成を変化させ、価値とコストの重みづけ、残差、反復を経て、安定した観測方向として形成されるものである。","line":105,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L158:S1","phase":"RAJ","literal":"形成し","text":"返路を形成しやすさ","line":158,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L239:S1","phase":"RAJ","literal":"変化し","text":"差分を受け取る開口が変わったため、感じられる世界が変化したのである。","line":239,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"RAJ:L473:S1","phase":"RAJ","literal":"変換し","text":"選択公理モジュールは、これらを人間の型へ変換しない。","line":473,"source":"02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md","near_qualifiers":[]},{"unit":"TAM:L34:S1","phase":"TAM","literal":"形成し","text":"何を第一義として目的化し、その共有がどのような世界を形成したかを境界で検査する仕事は、[`Truth_Management_and_Boundary_PDCA.ja.md`](../00_Overview/Truth_Management_and_Boundary_PDCA.ja.md) が主に扱う。","line":34,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]},{"unit":"TAM:L774:S1","phase":"TAM","literal":"形成し","text":"それらは、各モジュールが歴史的・物語的にどのような世界を形成しうるかを見るための拡張読解アトラスとして、別文書または付録層で管理する。","line":774,"source":"03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md","near_qualifiers":[]}]}}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const f=document.getElementById('family'),p=document.getElementById('phase'),q=document.getElementById('filter');
const E=s=>{const d=document.createElement('span');d.textContent=s;return d.innerHTML};
Object.entries(D.families).sort((a,b)=>b[1].length-a[1].length).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=`${k} (${v.length}表示)`;f.appendChild(o)});
function render(){const v=D.families[f.value]||[];const rows=v.filter(x=>(p.value==='ALL'||x.phase===p.value)&&(!q.value||[x.text,x.unit,x.literal].some(y=>y.includes(q.value))));
 document.getElementById('status').textContent=`${rows.length} 件（表示上限300 / 候補族）`;
 const graph=document.getElementById('graph');graph.textContent='';
 const ns='http://www.w3.org/2000/svg';const make=(tag,atts,txt)=>{let el=document.createElementNS(ns,tag);for(const[k,val]of Object.entries(atts))el.setAttribute(k,val);if(txt)el.textContent=txt;graph.appendChild(el)};
 make('rect',{x:40,y:90,width:170,height:68,rx:13,fill:'#d7e8f4',stroke:'#7299b2'});
 make('text',{x:125,y:129,fill:'#153c55','text-anchor':'middle','font-size':17},f.value);
 rows.slice(0,6).forEach((r,i)=>{let y=15+i*38;make('line',{x1:210,y1:125,x2:285,y2:y+14,stroke:'#91acbf','stroke-width':2});make('rect',{x:285,y,width:780,height:30,rx:6,fill:'#f0f5f8',stroke:'#d6e4ed'});make('text',{x:296,y:y+20,fill:'#27475d','font-size':12},(r.unit+'  '+r.text).slice(0,100))});
 let list=document.getElementById('items');list.textContent='';rows.slice(0,180).forEach(r=>{const x=document.createElement('article');x.innerHTML=`<small><span class="badge">${E(r.phase)}</span> ${E(r.unit)} ・ ${E(r.source)}:${r.line} ・ 操作表現「${E(r.literal)}」</small><p>${E(r.text)}</p><small>近接する条件・修飾表現：${E(r.near_qualifiers.join(' / ')||'検出なし')}</small>`;list.appendChild(x)}) }
[f,p,q].forEach(x=>x.addEventListener('input',render));render();
</script></body></html>
