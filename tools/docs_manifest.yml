# Public document manifest for Scientific Ontology / 存在境界論
# Version: 0.3.0

manifest:
  version: "0.4.0"
  role: "public-document-ledger"
  coverage: "full-public-inventory-with-provisional-registration"
  default_severity: "warning-only"
  release_gate_severity: "error"
  principle: >
    Track public-facing documents and expected metadata without turning early
    drafts into hard release blockers. Missing or incomplete manifest entries
    should be warnings during ordinary editing and release-gate errors only
    when the release process explicitly enables strict mode.
  note: >-
    The manifest is the canonical public document ledger for the v5 opening release. It includes both reviewed registrations
    and provisional registrations; provisional means navigation metadata is not yet fully human-reviewed.


  relation_contract_policy:
    applies_to: "documents participating in a coordination_group"
    canonical_location: "tools/docs_manifest.yml"
    markdown_projection: >
      Coordinated documents may include short human-readable relation and
      depth-interface summaries, but this manifest owns the machine-readable
      contract.
    enforcement:
      normal: "warning"
      release_gate: "error for duplicate ownership, broken targets, missing return paths, or missing depth interfaces"
    principles:
      - "Each concept ID has one canonical owner."
      - "Importing a concept permits reference and application, not silent redefinition."
      - "Exports state what a document contributes to downstream documents."
      - "Tests identify application documents or downstream models that expose the claim to operational feedback."
      - "Returns-to relations carry failure, residual, or revision payloads back upstream."
      - "A depth interface must preserve unresolved material and specify a return path."
      - "Cycles are allowed only when the relation type and returned payload are explicit."

  concept_id_policy:
    syntax: "lower_snake_case"
    stability: "Concept IDs remain stable even when visible Japanese or English labels change."
    path_rule: "Document paths use repository-relative POSIX separators."
    private_boundary: "Private-core paths and private implementation identifiers must not be indexed."

  path_policy:
    separator: "/"
    root: "."
    private_core_paths_must_not_be_indexed: true
    planned_documents_allowed: true

  required_fields_for_public_documents:
    - "path"
    - "document_type"
    - "title_ja"
    - "title_en"
    - "layer"
    - "status"
    - "public_profile"
    - "state"
    - registration_state
  document_type_values:
    - "assertion_document"
    - "root_readme"
    - "layer_readme"
    - "subdirectory_readme"
    - "common_fixed_explanation"
    - "root_document"
    - "index"
    - "visual_material"

  state_values:
    - "public"
    - "public-candidate"
    - "planned"
    - "legacy"
    - "deprecated"

  check_rules:
    manifest_path_missing:
      normal: "warning"
      release_gate: "error"
      note: "Use state: planned for documents that are intentionally listed before creation."
    unlisted_public_markdown:
      normal: "warning"
      release_gate: "warning"
      note: "The manifest may remain partial until release preparation."
    related_link_missing:
      normal: "warning"
      release_gate: "error"
    status_not_registered:
      normal: "warning"
      release_gate: "error"
    profile_mismatch:
      normal: "warning"
      release_gate: "warning"

  registration_state_values:
    - registered
    - provisional
  registration_state_policy:
    registered: Human-reviewed canonical navigation metadata.
    provisional: Canonical ledger entry usable for public reading, search, and navigation while metadata review remains
      open.
    boundary: Provisional registration does not assign concept ownership or typed logical relations unless separately
      declared in canonical manifest contracts.
