coordination_groups:
  core_document_responsibility_contract:
    label_ja: "中核文書責務分離・競合防止契約"
    label_en: "Core Document Responsibility and Non-Competition Contract"
    purpose: >
      Distribute conceptual responsibility across five documents without
      flattening their differences or allowing each document to reproduce the
      entire system.
    documents:
      - "00_Overview/Scientific_Ontology_Concept_Network.ja.md"
      - "02_Raj_Beauty/Entropy_Attributed_Difference_and_Cognitive_Axis_Formation.ja.md"
      - "03_Tam_Goodness/Optional_Axiom_Modules_as_Cognitive_Bridge.ja.md"
      - "00_Overview/Truth_Management_and_Boundary_PDCA.ja.md"
      - "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Organizational_Boundary_and_Port_Model.ja.md"
    invariant:
      - "The concept network maps positions and return paths; it does not become a compressed encyclopedia."
      - "Cognitive-axis theory owns formation, stabilization, and transformation of cognitive direction."
      - "Axiom modules own comparison, commensuration, suspension, and preservation of untranslatable residuals."
      - "Truth management owns purpose commitment, sharing, world formation, and boundary CA."
      - "The organizational model owns responsibility, ports, protocols, audit, and operational return paths."
    depth_port_requirement: true
    open_question_requirement: true
    relation_cycle_policy: "typed-return-cycles-allowed"


