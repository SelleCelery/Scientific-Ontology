tests:
  - id: meaning-owner
    from: 'doc:meaning_generation_model'
    relation: owns
    to: 'concept:meaning_generation'

  - id: concept-network-imports-meaning
    from: 'doc:scientific_ontology_concept_network'
    relation: imports
    to: 'concept:meaning_generation'

  - id: meaning-topic
    from: 'doc:meaning_generation_model'
    relation: belongs_to_topic
    to: 'topic:meaning'

  - id: meaning-layer
    from: 'doc:meaning_generation_model'
    relation: placed_in
    to: 'layer:sat_truth'

  - id: glossary-boundary-anchor
    from_label_contains: 'Boundary / 境界'
    from_type: glossary_term
    relation: lexical_anchor
    to: 'concept:epistemic_boundary_conditions'

  - id: system-map-references-concept-network
    from: 'artifact:system_map'
    relation: map_reference
    to: 'doc:scientific_ontology_concept_network'

  - id: concept-network-links-meaning-model
    from: 'doc:scientific_ontology_concept_network'
    relation_any:
      - concept_network_reference
      - links_to
    to: 'doc:meaning_generation_model'

  - id: cross-grammatical-commensuration-owner
    from: 'doc:commensuration_cross_grammatical_collation'
    relation: owns
    to: 'concept:cross_grammatical_commensuration'

  - id: cognitive-dynamics-imports-commensuration
    from: 'doc:05_research_notes_cognitive_dynamics_communication_studies_cognitive_dynamics_communication_model_ja'
    relation: imports
    to: 'concept:cross_grammatical_commensuration'

  - id: boundary-diplomacy-imports-commensuration
    from: 'doc:05_research_notes_cognitive_dynamics_communication_studies_boundary_diplomacy_and_port_allocation_ja'
    relation: imports
    to: 'concept:cross_grammatical_commensuration'

  - id: network-imports-commensuration
    from: 'doc:semantic_network_topology_commensuration_bandwidth'
    relation: imports
    to: 'concept:cross_grammatical_commensuration'

  - id: compression-imports-operational-port
    from: 'doc:05_research_notes_cognitive_dynamics_communication_studies_compression_of_existence_phases_ja'
    relation: imports
    to: 'concept:operational_port'

  - id: organization-imports-operational-port
    from: 'doc:05_research_notes_cognitive_dynamics_communication_studies_organizational_boundary_and_port_model_ja'
    relation: imports
    to: 'concept:operational_port'

path_tests:
  - id: meaning-topic-to-owner
    from: 'topic:meaning'
    to: 'concept:meaning_generation'
    max_depth: 3
    directed: false

  - id: glossary-boundary-to-critique
    from_label_contains: 'Boundary / 境界'
    from_type: glossary_term
    to: 'doc:boundary_epistemological_critique'
    max_depth: 4
    directed: false
