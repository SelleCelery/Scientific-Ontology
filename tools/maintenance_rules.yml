# Public maintenance rules for Scientific Ontology / 存在境界論
# Version: 0.2.0

maintenance_rules:
  version: "0.2.0"
  role: "terminology-and-maintenance-rules"
  default_severity: "warning"
  principle: >
    Detect public drift that can be checked mechanically, while leaving
    conceptual judgment to human or LLM review.

  term_rules:
    replacements:
      - from: "Internal Time"
        use: "intrinsic time"
        severity: "error"
        reason: "The project standard is intrinsic time. Internal Time should not be used as the English rendering of 内在時間."
        match_case: true
        report_allowed: false
        allowed_near:
          - "Do not translate"
          - "do not translate"
          - "not translate"
          - "should not be used"
          - "do not use"
          - "not `Internal Time`"
          - "とは訳さない"
          - "訳さない"
          - "使用せず"
          - "使わず"
          - "用いず"
          - "表記は使用せず"
          - "intrinsic time に統一"
          - "`intrinsic time` に統一"
        allowed_patterns:
          - '(?i)\b(do not|don''t|not|never|should not|must not)\b.{0,120}`?Internal Time`?'
          - '(?i)`?Internal Time`?.{0,120}\b(should not|must not|do not|don''t|not be used|not translate|not be translated)\b'
          - '`?Internal Time`?.{0,120}(とは訳さない|訳さない|使わない|使わず|使用しない|使用せず|用いない|用いず)'
          - '`?Internal Time`?.{0,120}(表記)?は?(使用せず|使わず|用いず).{0,80}`?intrinsic time`?.{0,80}(統一|統一する)'
          - '`?Internal Time`?.{0,120}`?intrinsic time`?.{0,80}(統一|統一する)'
      - from: "internal time"
        use: "intrinsic time"
        severity: "error"
        reason: "The canonical English commensuration of 内在時間 is intrinsic time."
        match_case: true
        report_allowed: false
      - from: "internal-time"
        use: "intrinsic-time"
        severity: "error"
        reason: "Use intrinsic-time when the canonical term modifies another noun."
        match_case: false
        report_allowed: false
      - from: "Recognition_Dynamics_Communication_Model"
        use: "Cognitive_Dynamics_Communication_Model"
        severity: "error"
        reason: "The public model and file name use Cognitive rather than Recognition."
        match_case: true
      - from: "05_Research_Notes/Cross_Domain_Ontological_Notes/Organizational_Boundary_and_Port_Model.ja.md"
        use: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Organizational_Boundary_and_Port_Model.ja.md"
        severity: "warning"
        reason: "The organizational port model belongs to Cognitive Dynamics Communication Studies."
        match_case: true
      - from: "Intricit Time"
        use: "intrinsic time"
        severity: "error"
        reason: "Legacy typo or obsolete rendering."
        match_case: false
      - from: "科学的存在論"
        use: "存在境界論"
        severity: "warning"
        reason: "Current Japanese public-facing name is 存在境界論. The older name may appear only as former/development name."
        allowed_near:
          - "旧称"
          - "開発名"
          - "former name"
          - "development name"

    exceptions:
      - term: "Internal Time"
        reason: "Allowed only when it appears as a prohibited rendering, translation warning, or legacy-name note. Suppress reporting in such contexts."
        report: false
        context_window: 360
        paths:
          - "05_Research_Notes/Claim_Strength_Table_History_Field_Topology.md"
          - "05_Research_Notes/Physical_Cosmological_Notes/README.md"
          - "05_Research_Notes/Research_Notes_Index.md"
          - "tools/CHECKER_USAGE*.md"
        allowed_near:
          - "とは訳さない"
          - "訳さない"
          - "使用せず"
          - "使わず"
          - "用いず"
          - "表記は使用せず"
          - "intrinsic time に統一"
          - "`intrinsic time` に統一"
          - "Do not translate"
          - "do not translate"
          - "should not be used"
          - "do not use"
        allowed_patterns:
          - '(?i)\b(do not|don''t|not|never|should not|must not)\b.{0,160}`?Internal Time`?'
          - '(?i)`?Internal Time`?.{0,160}\b(should not|must not|do not|don''t|not be used|not translate|not be translated)\b'
          - '`?Internal Time`?.{0,160}(とは訳さない|訳さない|使わない|使わず|使用しない|使用せず|用いない|用いず)'
          - '`?Internal Time`?.{0,160}(表記)?は?(使用せず|使わず|用いず).{0,80}`?intrinsic time`?.{0,80}(統一|統一する)'
          - '`?Internal Time`?.{0,160}`?intrinsic time`?.{0,80}(統一|統一する)'

    caution_terms:
      - term: "エンタングルメント"
        severity: "warning"
        note: "量子論上のエンタングルメントと同一視しない。"
        expected_boundary_markers:
          - "同一視しない"
          - "置き換えない"
          - "代替ではない"
          - "not identical with quantum entanglement"
          - "does not replace quantum theory"
      - term: "エンタングル"
        severity: "warning"
        note: "SO内部語として使う場合は、履歴拘束・相互作用履歴の持続として説明する。"
        expected_boundary_markers:
          - "履歴"
          - "相互作用"
          - "拘束"
          - "history"
          - "interaction"
      - term: "エントロピー"
        severity: "warning"
        note: "標準熱力学・情報理論との区別を明記する。"
        expected_boundary_markers:
          - "標準"
          - "同一ではない"
          - "概念語"
          - "standard thermodynamics"
          - "information theory"
      - term: "ネゲントロピー経済"
        severity: "warning"
        note: "経済理論、熱力学的証明、政策提案として提示しない。"
        expected_boundary_markers:
          - "経済理論ではない"
          - "熱力学的証明ではない"
          - "政策提案ではない"
          - "not an empirical economic theory"
          - "not a thermodynamic proof"


    canonical_term_contracts:
      Cognitive Field:
        canonical_ja: "認識場"
        owner: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Cognitive_Dynamics_Communication_Model.ja.md"
        non_identity: "physical field, neuroscientific entity, fixed psychological space"
      Cognitive Phase:
        canonical_ja: "認識相"
        owner: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Cognitive_Dynamics_Communication_Model.ja.md"
        non_identity: "personality type, developmental stage, fixed cognitive function"
      Operational Discretization:
        canonical_ja: "操作的離散化"
        owner: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Cognitive_Dynamics_Communication_Model.ja.md"
        non_identity: "ontological proof of discrete cognitive modules"
      Port:
        canonical_ja: "ポート"
        owner: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Cognitive_Dynamics_Communication_Model.ja.md"
        rule: "General operational concept; Organizational Port is owned separately."
      Organizational Port:
        canonical_ja: "組織ポート"
        owner: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Organizational_Boundary_and_Port_Model.ja.md"
      Existence Phase:
        canonical_ja: "存在相"
        owner: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Compression_of_Existence_Phases.ja.md"
      Existence-Phase Compression:
        canonical_ja: "存在相圧縮"
        owner: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Compression_of_Existence_Phases.ja.md"
      Boundary Diplomacy:
        canonical_ja: "境界外交"
        owner: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Boundary_Diplomacy_and_Port_Allocation.ja.md"
      Port Allocation:
        canonical_ja: "ポート配分"
        owner: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Boundary_Diplomacy_and_Port_Allocation.ja.md"
      Multi-Port Potentiality:
        canonical_ja: "複数ポート潜在性"
        owner: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Boundary_Diplomacy_and_Port_Allocation.ja.md"
      Scoped Port Operation:
        canonical_ja: "限定ポート運用"
        owner: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Boundary_Diplomacy_and_Port_Allocation.ja.md"
      Meaning-Experience Field:
        canonical_ja: "意味・経験場"
        owner: "04_Applications/Social_Boundary_Design/Specification_for_Peace.ja.md"
        non_identity: "physical field"
      Meaning Capacity:
        canonical_ja: "意味容量"
        owner: "04_Applications/Social_Boundary_Design/Specification_for_Peace.ja.md"
        forbidden_rendering: "Meaning Capacitance as the canonical general term"
      Meaning-Experience Capacitor:
        canonical_ja: "意味経験キャパシタ"
        owner: "04_Applications/Social_Boundary_Design/Specification_for_Peace.ja.md"
        handling: "structural analogy only"
      Gateway Capture:
        canonical_ja: "ゲートウェイ捕捉"
        owner: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Boundary_Diplomacy_and_Port_Allocation.ja.md"
      Single-Metric Compression:
        canonical_ja: "単一指標圧縮"
        owner: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Compression_of_Existence_Phases.ja.md"
      Boundary Update:
        canonical_ja: "境界更新"
        owner: "05_Research_Notes/Cognitive_Dynamics_Communication_Studies/Organizational_Boundary_and_Port_Model.ja.md"

    high_depth_identifier_rules:
      canonical_identifiers:
        - "iMass"
        - "rMass"
      handling:
        - "Keep the canonical identifier unexpanded in English commensuration."
        - "Allow generative lineage, paired relations, application manifestations, and conceptual effects to be explained."
        - "Do not promote a manifestation, etymological resonance, or provisional rendering into an exhaustive definition."
        - "Preserve claim strength, lineage, non-identity, application scope, unresolved residuals, and non-claim boundaries."
      forbidden_expansions_as_canonical_names:
        iMass:
          - "Information Inertial Mass"
          - "Imaginary Mass"
        rMass:
          - "Rendered Mass"
          - "Real Mass"
      intrinsic_time:
        canonical_noun: "intrinsic time"
        canonical_modifier: "intrinsic-time"
        forbidden:
          - "Internal Time"
          - "internal time"
          - "internal-time"

  profile_rules:
    readme_uses:
      - "Public profile"
      - "Claim profile"
    assertion_documents_use:
      - "Claim strength"
    internal_tables_use:
      - "S"
      - "E"
      - "U"
      - "P"
      - "V"
    forbidden_patterns:
      - pattern: "Claim profile: Literary/"
        severity: "warning"
        reason: "Literary or creative scope should be represented by Status/Scope or Claim strength, not a custom Claim profile namespace."
      - pattern: "Claim profile: S"
        severity: "warning"
        reason: "Use Claim strength for S/E/U/P/V classifications."

  public_boundary_rules:
    forbidden_public_patterns:
      - pattern: "sandbox:/"
        severity: "error"
      - pattern: "/mnt/data"
        severity: "error"
      - pattern: "file_000000"
        severity: "error"
      - pattern: "myfiles_browser"
        severity: "error"
      - pattern: "10_PUBLIC_GITHUB"
        severity: "error"
    private_core_terms:
      - term: "full AMP Core"
        public_handling: "excluded-material marker only"
      - term: "full ITS theory"
        public_handling: "excluded-material marker only"
      - term: "soul_core"
        public_handling: "do not expose"
      - term: "Role AP"
        public_handling: "do not expose unless explicitly public and abstracted"


  conceptual_contract_rules:
    source_of_truth: "tools/docs_manifest.yml"
    applies_to_coordination_group: "core_document_responsibility_contract"
    principle: >
      Mechanical checks should detect broken ownership, relations, and return
      paths. Human or LLM review should decide whether prose has silently
      redefined an imported concept.

    ownership_rules:
      canonical_owner_unique:
        severity: "error"
        rule: "Each concept ID in concept_ownership must have exactly one canonical_owner."
      owned_concept_declared:
        severity: "error"
        rule: "Every item in logical_contract.owns must appear in concept_ownership or be explicitly marked document_local."
      imported_concept_not_reowned:
        severity: "error"
        rule: "A document must not list the same concept in both owns and imports."
      imported_definition_drift:
        severity: "warning"
        review: "LLM"
        rule: >
          Compare prose definitions against the canonical owner. Flag passages
          that appear to redefine an imported concept rather than reference,
          apply, test, or operationalize it.
      owner_path_exists:
        severity: "error"
        release_gate: true

    relation_rules:
      required_fields:
        severity: "error"
        fields:
          - "owns"
          - "imports"
          - "exports"
          - "tests"
          - "returns_to"
          - "depth_interface"
          - "delegates"
          - "explicit_open_questions"
      target_path_exists:
        severity: "error"
        applies_to:
          - "tests.target"
          - "returns_to.target"
          - "delegates.target"
      export_has_consumer:
        severity: "warning"
        rule: "Each export should be imported, tested, or named as a public output by at least one downstream document."
      import_has_owner:
        severity: "error"
        rule: "Each imported canonical concept must resolve to concept_ownership."
      return_payload_required:
        severity: "error"
        rule: "Every returns_to relation must name a non-empty payload."
      cycle_policy:
        severity: "error"
        allowed_when:
          - "The backward edge is expressed through returns_to."
          - "The returned payload is explicit."
          - "The forward relation is imports, exports, delegates, or tests."
        forbidden_when:
          - "Two documents both claim canonical ownership of the same concept."
          - "A cycle has no revision, residual, failure, or test payload."

    depth_port_rules:
      required_for_coordinated_documents: true
      required_fields:
        - "entry_signals"
        - "retains"
        - "delegates_to"
        - "return_path"
        - "closure_policy"
      missing_depth_interface:
        severity: "error"
      empty_retains:
        severity: "error"
        reason: "A depth port that preserves nothing is only a disguised hand-off."
      empty_return_path:
        severity: "error"
        reason: "Deep exploration must return to a public boundary, model revision, or explicit open question."
      false_depth_closure:
        severity: "warning"
        review: "LLM"
        markers:
          - "proves the whole system"
          - "fully resolves"
          - "complete explanation"
          - "therefore all"
        rule: >
          Flag claims that use a depth interface to close an unresolved
          metaphysical, physical, psychological, or institutional question
          without an explicit claim boundary.
      orphan_depth_delegate:
        severity: "warning"
        rule: "A conceptual delegates_to target may remain non-path-based, but it must be named in the concept network or aporia registry."
      open_question_required:
        severity: "warning"
        rule: "Each coordinated document should retain at least one explicit open question."

    five_document_non_competition_rules:
      concept_network:
        may:
          - "map"
          - "route"
          - "register aporia"
          - "summarize roles"
        must_not:
          - "replace detailed definitions owned by the other four documents"
      cognitive_axis_formation:
        may:
          - "define formation, stabilization, and transformation of cognitive direction"
        must_not:
          - "own epistemic validity, meaning generation, worldview ranking, or purpose management"
      optional_axiom_bridge:
        may:
          - "compare"
          - "commensurate"
          - "suspend"
          - "retain translation residuals"
        must_not:
          - "diagnose persons"
          - "rank worldviews as universally superior"
          - "force synthesis"
      truth_management:
        may:
          - "commit purpose"
          - "describe sharing and world formation"
          - "run boundary CA"
        must_not:
          - "redefine cognitive-axis formation"
          - "erase the costs returned by applications"
      organizational_boundary_and_ports:
        may:
          - "operationalize purpose as responsibility, ports, protocols, audit, and stop conditions"
        must_not:
          - "claim authority to define the first purpose"
          - "treat implementation closure as final truth"

    ai_review_workflow:
      ordinary_edit:
        - "Validate YAML structure and target paths."
        - "Report duplicate ownership and missing return payloads."
        - "Warn about incomplete depth interfaces."
      pull_request:
        - "Compare changed prose with owns/imports/delegates."
        - "Detect silent concept redefinition."
        - "Summarize new residuals and open questions."
      release_gate:
        - "Require all five coordinated documents to exist."
        - "Require unique canonical ownership."
        - "Require valid depth interfaces and return paths."
        - "Require application tests or an explicit reason for absence."
        - "Generate a concept-contract report for human approval."


  release_rules:
    version_metadata:
      severity: "warning"
      note: "Multiple versions may be legitimate in release history, but release metadata should identify the current release clearly."
    doi_metadata:
      severity: "warning"
      note: "Multiple DOI strings may be legitimate when version DOI, concept DOI, and older release DOI are all present."
