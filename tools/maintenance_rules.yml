# Public maintenance rules for Scientific Ontology / 存在境界論
# Version: 0.1.0

maintenance_rules:
  version: "0.1.0"
  role: "terminology-and-maintenance-rules"
  default_severity: "warning"
  principle: >
    Detect public drift that can be checked mechanically, while leaving
    conceptual judgment to human or LLM review.

  term_rules:
    replacements:
      - from: "Internal Time"
        use: "intrinsic time"
        severity: "error"
        reason: "The project standard is intrinsic time. Internal Time should not be used as the English rendering of 内在時間."
        match_case: true
        report_allowed: false
        allowed_near:
          - "Do not translate"
          - "do not translate"
          - "not translate"
          - "should not be used"
          - "do not use"
          - "not `Internal Time`"
          - "とは訳さない"
          - "訳さない"
          - "使用せず"
          - "使わず"
          - "用いず"
          - "表記は使用せず"
          - "intrinsic time に統一"
          - "`intrinsic time` に統一"
        allowed_patterns:
          - '(?i)\b(do not|don''t|not|never|should not|must not)\b.{0,120}`?Internal Time`?'
          - '(?i)`?Internal Time`?.{0,120}\b(should not|must not|do not|don''t|not be used|not translate|not be translated)\b'
          - '`?Internal Time`?.{0,120}(とは訳さない|訳さない|使わない|使わず|使用しない|使用せず|用いない|用いず)'
          - '`?Internal Time`?.{0,120}(表記)?は?(使用せず|使わず|用いず).{0,80}`?intrinsic time`?.{0,80}(統一|統一する)'
          - '`?Internal Time`?.{0,120}`?intrinsic time`?.{0,80}(統一|統一する)'
      - from: "Intricit Time"
        use: "intrinsic time"
        severity: "error"
        reason: "Legacy typo or obsolete rendering."
        match_case: false
      - from: "科学的存在論"
        use: "存在境界論"
        severity: "warning"
        reason: "Current Japanese public-facing name is 存在境界論. The older name may appear only as former/development name."
        allowed_near:
          - "旧称"
          - "開発名"
          - "former name"
          - "development name"

    exceptions:
      - term: "Internal Time"
        reason: "Allowed only when it appears as a prohibited rendering, translation warning, or legacy-name note. Suppress reporting in such contexts."
        report: false
        context_window: 360
        paths:
          - "05_Research_Notes/Claim_Strength_Table_History_Field_Topology.md"
          - "05_Research_Notes/Physical_Cosmological_Notes/README.md"
          - "05_Research_Notes/Research_Notes_Index.md"
          - "tools/CHECKER_USAGE*.md"
        allowed_near:
          - "とは訳さない"
          - "訳さない"
          - "使用せず"
          - "使わず"
          - "用いず"
          - "表記は使用せず"
          - "intrinsic time に統一"
          - "`intrinsic time` に統一"
          - "Do not translate"
          - "do not translate"
          - "should not be used"
          - "do not use"
        allowed_patterns:
          - '(?i)\b(do not|don''t|not|never|should not|must not)\b.{0,160}`?Internal Time`?'
          - '(?i)`?Internal Time`?.{0,160}\b(should not|must not|do not|don''t|not be used|not translate|not be translated)\b'
          - '`?Internal Time`?.{0,160}(とは訳さない|訳さない|使わない|使わず|使用しない|使用せず|用いない|用いず)'
          - '`?Internal Time`?.{0,160}(表記)?は?(使用せず|使わず|用いず).{0,80}`?intrinsic time`?.{0,80}(統一|統一する)'
          - '`?Internal Time`?.{0,160}`?intrinsic time`?.{0,80}(統一|統一する)'

    caution_terms:
      - term: "エンタングルメント"
        severity: "warning"
        note: "量子論上のエンタングルメントと同一視しない。"
        expected_boundary_markers:
          - "同一視しない"
          - "置き換えない"
          - "代替ではない"
          - "not identical with quantum entanglement"
          - "does not replace quantum theory"
      - term: "エンタングル"
        severity: "warning"
        note: "SO内部語として使う場合は、履歴拘束・相互作用履歴の持続として説明する。"
        expected_boundary_markers:
          - "履歴"
          - "相互作用"
          - "拘束"
          - "history"
          - "interaction"
      - term: "エントロピー"
        severity: "warning"
        note: "標準熱力学・情報理論との区別を明記する。"
        expected_boundary_markers:
          - "標準"
          - "同一ではない"
          - "概念語"
          - "standard thermodynamics"
          - "information theory"
      - term: "ネゲントロピー経済"
        severity: "warning"
        note: "経済理論、熱力学的証明、政策提案として提示しない。"
        expected_boundary_markers:
          - "経済理論ではない"
          - "熱力学的証明ではない"
          - "政策提案ではない"
          - "not an empirical economic theory"
          - "not a thermodynamic proof"

  profile_rules:
    readme_uses:
      - "Public profile"
      - "Claim profile"
    assertion_documents_use:
      - "Claim strength"
    internal_tables_use:
      - "S"
      - "E"
      - "U"
      - "P"
      - "V"
    forbidden_patterns:
      - pattern: "Claim profile: Literary/"
        severity: "warning"
        reason: "Literary or creative scope should be represented by Status/Scope or Claim strength, not a custom Claim profile namespace."
      - pattern: "Claim profile: S"
        severity: "warning"
        reason: "Use Claim strength for S/E/U/P/V classifications."

  public_boundary_rules:
    forbidden_public_patterns:
      - pattern: "sandbox:/"
        severity: "error"
      - pattern: "/mnt/data"
        severity: "error"
      - pattern: "file_000000"
        severity: "error"
      - pattern: "myfiles_browser"
        severity: "error"
      - pattern: "10_PUBLIC_GITHUB"
        severity: "error"
    private_core_terms:
      - term: "full AMP Core"
        public_handling: "excluded-material marker only"
      - term: "full ITS theory"
        public_handling: "excluded-material marker only"
      - term: "soul_core"
        public_handling: "do not expose"
      - term: "Role AP"
        public_handling: "do not expose unless explicitly public and abstracted"

  release_rules:
    version_metadata:
      severity: "warning"
      note: "Multiple versions may be legitimate in release history, but release metadata should identify the current release clearly."
    doi_metadata:
      severity: "warning"
      note: "Multiple DOI strings may be legitimate when version DOI, concept DOI, and older release DOI are all present."
